<script id="py-tdf-binary" type="text/python-src">
"""実寸法師(.tdf)バイナリの低レベルパーサー。

tdfファイルはオフセットベースの可変長レコード形式。本モジュールは以下の3種類の
要素を読み取り専用で解析する(書き込みは一切行わない)。

1. テキスト要素: マーカー「00 N (2*N) 00」(Nはテキストの機能種別、1〜63)で検出。
   ヘッダー52バイト([pre_field:4][X,Y,H,W,rot:各8]*5[pad:4][id_field:4])の後に
   マーカー(4)+val1,val2(4*2)+文字列(cp932)が続く。
   同じ文字列が図面内に複数回現れることがあり、実体をもつ「本体」と、本体の
   id_fieldを指すだけで自分では文字列を持たない「参照」に分かれる。

2. 直線要素: サイズヘッダー0x80000038(56バイト)、val=1、その後
   [ref:4]*3 + [x1,y1,x2,y2: double]*4。

3. 円弧要素: 「中心+半径」レコード(サイズ0x80000030=48バイト、val=2、
   [ref:4]*4 + [cx,cy,r: double]*3)の直後に、「開始角・終了角」レコード
   (サイズ0x80000020=32バイト、[cx?][val][ref] + [a1,a2: double(rad)]*2、
   実際の角度値はレコード先頭+16バイト目から)が続く。

これらの構造は2026-09realistic実機データの解析で判明したもので、正式仕様書は無い。
"""
from __future__ import annotations

import math
import re
import struct
import unicodedata
from dataclasses import dataclass, field

HEADER_LEN = 52
MAX_N = 63

_SIZE_LINE = -2147483592       # 0x80000038 = 56
_SIZE_ARC_CENTER = -2147483600  # 0x80000030 = 48
_SIZE_ARC_ANGLE = -2147483616   # 0x80000020 = 32

DAI_PATTERN = re.compile(r"^[0-9]+台$")


@dataclass
class TextRecord:
    idx: int
    rec_start: int
    x: float
    y: float
    h: float
    w: float
    rot: float
    id_field: int
    text: str | None


@dataclass
class LineRecord:
    offset: int
    ref0: int
    x1: float
    y1: float
    x2: float
    y2: float

    @property
    def length(self) -> float:
        return math.hypot(self.x2 - self.x1, self.y2 - self.y1)


@dataclass
class ArcRecord:
    offset: int
    cx: float
    cy: float
    r: float
    a1: float | None  # 開始角(ラジアン)


@dataclass
class TdfData:
    path: str
    raw: bytes
    texts: list[TextRecord] = field(default_factory=list)
    lines: list[LineRecord] = field(default_factory=list)
    arcs: list[ArcRecord] = field(default_factory=list)
    body_text_by_id: dict[int, str] = field(default_factory=dict)
    body_rot_by_id: dict[int, float] = field(default_factory=dict)

    def resolve_text(self, rec: TextRecord) -> str | None:
        if rec.text is not None:
            return rec.text
        return self.body_text_by_id.get(rec.id_field)

    def resolve_rot(self, rec: TextRecord) -> float:
        if rec.text is not None:
            return rec.rot
        return self.body_rot_by_id.get(rec.id_field, 0.0)


def _find_all_text_markers(data: bytes) -> list[int]:
    idxs = []
    n = len(data)
    for i in range(n - 3):
        if data[i] != 0 or data[i + 3] != 0:
            continue
        b1 = data[i + 1]
        if b1 == 0 or b1 > MAX_N:
            continue
        if data[i + 2] != b1 * 2:
            continue
        idxs.append(i)
    return idxs


def _parse_texts(data: bytes) -> list[TextRecord]:
    records = []
    for idx in _find_all_text_markers(data):
        rec_start = idx - HEADER_LEN
        if rec_start < 0:
            continue
        try:
            x, y, h, w, rot = struct.unpack_from("<5d", data, rec_start + 4)
            id_field = struct.unpack_from("<I", data, rec_start + 48)[0]
            val1, _val2 = struct.unpack_from("<2i", data, idx + 4)
        except struct.error:
            continue

        text = None
        text_len = val1 - 8
        text_start = idx + 12
        if 0 < text_len <= 200 and text_start + text_len <= len(data):
            raw = data[text_start:text_start + text_len]
            nul = raw.find(b"\x00")
            if nul != -1:
                raw = raw[:nul]
            if raw:
                try:
                    text = raw.decode("cp932")
                except UnicodeDecodeError:
                    text = None

        records.append(TextRecord(idx, rec_start, x, y, h, w, rot, id_field, text))
    return records


def _parse_lines(data: bytes) -> list[LineRecord]:
    n = len(data)
    lines = []
    i = 0
    while i < n - 56:
        size_raw = struct.unpack_from("<i", data, i)[0]
        if size_raw == _SIZE_LINE:
            val = struct.unpack_from("<i", data, i + 4)[0]
            if val == 1:
                try:
                    ref0 = struct.unpack_from("<i", data, i + 8)[0]
                    x1, y1, x2, y2 = struct.unpack_from("<4d", data, i + 24)
                except struct.error:
                    i += 1
                    continue
                if all(v == v and abs(v) < 1_000_000 for v in (x1, y1, x2, y2)):
                    lines.append(LineRecord(i, ref0, x1, y1, x2, y2))
        i += 1
    return lines


def _parse_arcs(data: bytes) -> list[ArcRecord]:
    n = len(data)
    arcs = []
    i = 0
    while i < n - 48:
        size_raw = struct.unpack_from("<i", data, i)[0]
        if size_raw == _SIZE_ARC_CENTER:
            val = struct.unpack_from("<i", data, i + 4)[0]
            if val == 2:
                try:
                    cx, cy, r = struct.unpack_from("<3d", data, i + 24)
                except struct.error:
                    i += 1
                    continue
                if cx == cx and cy == cy and r == r and 0 < r < 1000 and abs(cx) < 1_000_000 and abs(cy) < 1_000_000:
                    a1 = None
                    angle_off = i + 48
                    if angle_off + 32 <= n:
                        size2 = struct.unpack_from("<i", data, angle_off)[0]
                        if size2 == _SIZE_ARC_ANGLE:
                            try:
                                a1, _a2 = struct.unpack_from("<2d", data, angle_off + 16)
                            except struct.error:
                                a1 = None
                    arcs.append(ArcRecord(i, cx, cy, r, a1))
        i += 1
    return arcs


def load(path: str) -> TdfData:
    """tdfファイルを読み取り専用で解析する。"""
    with open(path, "rb") as f:
        raw = f.read()

    texts = _parse_texts(raw)
    lines = _parse_lines(raw)
    arcs = _parse_arcs(raw)

    body_text_by_id: dict[int, str] = {}
    body_rot_by_id: dict[int, float] = {}
    for r in texts:
        if r.text is not None:
            body_text_by_id.setdefault(r.id_field, r.text)
            body_rot_by_id.setdefault(r.id_field, r.rot)

    return TdfData(
        path=path, raw=raw, texts=texts, lines=lines, arcs=arcs,
        body_text_by_id=body_text_by_id, body_rot_by_id=body_rot_by_id,
    )


def is_dai_cell(text: str | None) -> bool:
    """「N台」形式のセルかどうか(全角/半角ゆれを吸収)。"""
    if not text:
        return False
    normalized = unicodedata.normalize("NFKC", text)
    return bool(DAI_PATTERN.match(normalized))

<script id="py-tdf-master-extractor" type="text/python-src">
"""実寸法師(.tdf)から製品マスタ情報(図番・製品マーク・設計符号・サイズ・本数・
重量・長さ・左継手・右継手)を抽出するロジック。

2026-09-11、YK-AB01(普通梁)・WR-1G-1(斜め梁)の2ファイルの実機解析で確立した
ルールをコード化したもの。適用範囲はこの2パターンの検証に基づく。

前提となる図面構造:
  - 製品情報は「製品マーク | 設計符号 | サイズ | 本数(N台) [| 重量(N.Nkg)]」という
    横並びテーブルとして、pad=0の通常テキストで描画されている。
  - 図番はタイトル欄のテキスト(高さH=100前後、他の注記より大きい)。
  - 「長さ」は、製品マーク〜本数のX範囲・製品マークのYより上にある数値寸法群の
    うち、(a)図面の主軸方向に沿う直線と長さが一致する本数が最多で、
    (b)出現回数が多すぎる値(取付ピッチ)は原則除外するが、他の系列との合計が
    一致するなら復活する、という手順で1つに絞り込む。
  - 「左継手・右継手」は、長丸(半径が一致し開始角の差が180度の円弧ペア)の
    中心に対応するテキストを候補とし、回転後座標で同じY(勾配)を持つペアを
    その製品の継手とみなし、X(回転後)の小さい方を左、大きい方を右とする。
"""
from __future__ import annotations

import math
import re
from dataclasses import dataclass, field

import tdf_binary as tb


# ---------------------------------------------------------------------------
# 共通ユーティリティ
# ---------------------------------------------------------------------------

def _try_float(s: str | None) -> float | None:
    if s is None:
        return None
    try:
        return float(s)
    except ValueError:
        return None


SIZE_PATTERN = re.compile(
    r"^(H|BH|SH|TH|\[|L|BOX|角|[0-9]+φ)[\-‐]?\s*[0-9]"
)

# 「同じ行」とみなすY座標の許容誤差。当初1.0(ほぼ完全一致)だったが、
# WA1-1B-02Aで、同じ行のはずのマーク+本数セル(Y=10984.3)と設計符号+
# サイズセル(Y=10978.0)の間に6.3程度のズレがあり、行として認識されず
# 2マーク(WA11-1TB441-5/6)が丸ごと欠落する不具合があった(2026-09-14)。
# 行間隔は実測240前後あるため、10.0に広げても別の行と混同するリスクは
# 十分小さい。
SAME_ROW_Y_TOLERANCE = 10.0


def _looks_like_size(text: str) -> bool:
    return bool(SIZE_PATTERN.match(text.strip()))


# ---------------------------------------------------------------------------
# 製品情報テーブルの検出
# ---------------------------------------------------------------------------

@dataclass
class ProductRow:
    mark: str
    design_code: str | None
    size: str | None
    count: str | None
    weight: str | None
    x_mark: float
    x_next: float  # 本数セルのX座標(長さ判定のX範囲右端に使う)
    y: float
    length: float | None = None
    left_joint: str | None = None
    right_joint: str | None = None
    drawing_number: str | None = None


def find_product_rows(tdf: tb.TdfData) -> list[ProductRow]:
    """「N台」セルを起点に、同じ行の製品マーク・設計符号・サイズを逆算して集める。

    本体・参照のどちらも行の起点になり得るため、resolve_text()で文字列を解決した
    上で、実際の配置座標(重複しない)ごとに1行として扱う。
    """
    dai_cells = []
    for r in tdf.texts:
        if r.rot != 0:
            continue
        text = tdf.resolve_text(r)
        if text and tb.is_dai_cell(text):
            dai_cells.append(r)

    rows: list[ProductRow] = []
    for dai in dai_cells:
        # 同じ行とみなせるY範囲で、Xがdaiより小さい通常テキスト(rot=0)を
        # 集めて左から並べる
        same_row = [
            r for r in tdf.texts
            if r.rot == 0 and abs(r.y - dai.y) < SAME_ROW_Y_TOLERANCE and r.x < dai.x and tdf.resolve_text(r)
        ]
        same_row.sort(key=lambda r: r.x)
        if len(same_row) < 3:
            continue
        # 直近3つを [製品マーク, 設計符号, サイズ] の順とみなす(サイズがdaiに一番近い)
        size_rec, code_rec, mark_rec = same_row[-1], same_row[-2], same_row[-3]
        size_text = tdf.resolve_text(size_rec)
        if not _looks_like_size(size_text):
            continue

        # 重量(daiより右、ほぼ同じY、"N.Nkg"形式)があれば拾う。重量セルは本数セルと
        # 数ピクセル分Yがずれることがあるため、許容幅を広めに取る。
        weight_text = None
        same_row_right = [
            r for r in tdf.texts
            if r.rot == 0 and abs(r.y - dai.y) < 100.0 and r.x > dai.x and tdf.resolve_text(r)
        ]
        same_row_right.sort(key=lambda r: r.x)
        if same_row_right:
            cand = tdf.resolve_text(same_row_right[0])
            if cand and cand.rstrip().endswith("kg"):
                weight_text = cand

        rows.append(ProductRow(
            mark=tdf.resolve_text(mark_rec), design_code=tdf.resolve_text(code_rec),
            size=size_text, count=tdf.resolve_text(dai), weight=weight_text,
            x_mark=mark_rec.x, x_next=dai.x, y=dai.y,
        ))

    rows.sort(key=lambda r: r.x_mark)
    return rows


_DRAWING_NUMBER_PATTERN = re.compile(r"^[A-Za-z][A-Za-z0-9\-]{2,19}$")


def _find_zumenbango_label_pos(tdf: tb.TdfData) -> tuple[float, float] | None:
    """「図」「面」「番」「号」の4文字が同じY・等間隔でX方向に連続して並ぶ
    箇所(タイトル欄の「図面番号」ラベルそのもの)を探し、その(Y, X中心)を
    返す。単独の「図」「面」等の文字が他の場所にも現れることがあるため、
    4文字が実際に連続しているものだけを対象にする。"""
    chars: dict[str, list] = {"図": [], "面": [], "番": [], "号": []}
    for r in tdf.texts:
        text = tdf.resolve_text(r)
        if text and r.rot == 0 and text.strip() in chars:
            chars[text.strip()].append(r)

    if not all(chars.values()):
        return None

    for zu in chars["図"]:
        row = [zu]
        cur = zu
        for nextchar in ("面", "番", "号"):
            cand = [
                r for r in chars[nextchar]
                if abs(r.y - zu.y) < 1.0 and cur.x < r.x < cur.x + cur.h * 3
            ]
            if not cand:
                break
            cur = min(cand, key=lambda r: r.x)
            row.append(cur)
        else:
            return (zu.y, sum(r.x for r in row) / len(row))
    return None


def find_drawing_number(tdf: tb.TdfData) -> str | None:
    """タイトル欄の図番らしきテキストを推定する。

    まず「図面番号」ラベル(4文字が連続して並ぶ箇所)を探し、その近く
    (Y座標の差が500mm以内)にある英数字+ハイフンの候補の中で、ラベルに
    最もX方向で近いものを図番として採用する。ラベルが見つからない場合や
    近くに候補が無い場合は、従来通り文字高さが最も大きいものを採用する
    (フォールバック)。

    2026-09-14、鳥取現場図面EA1-1G-14で、製品テーブルの「設計符号」欄が
    たまたまタイトル欄の図番と同じ文字高さだったため誤って設計符号の方を
    採用してしまう問題が発覚し、位置情報(ラベルとの近さ)を優先する方式に
    改訂した。"""
    candidates = []
    for r in tdf.texts:
        if r.text is None or r.rot != 0:
            continue
        t = r.text.strip()
        if _DRAWING_NUMBER_PATTERN.match(t) and not t.isdigit():
            candidates.append(r)
    if not candidates:
        return None

    label_pos = _find_zumenbango_label_pos(tdf)
    if label_pos is not None:
        label_y, label_x = label_pos
        near = [r for r in candidates if abs(r.y - label_y) < 500.0]
        if near:
            near.sort(key=lambda r: abs(r.x - label_x))
            return near[0].text.strip()

    candidates.sort(key=lambda r: -r.h)
    return candidates[0].text.strip()


# ---------------------------------------------------------------------------
# 「長さ」の判定
# ---------------------------------------------------------------------------

def _axis_key(rot_deg: float, xr: float, yr: float) -> tuple[str, float]:
    r = rot_deg % 180
    if r > 90:
        r = 180 - r
    if r < 45:
        return ("yr", round(yr, 0))
    return ("xr", round(xr, 0))


def determine_length(tdf: tb.TdfData, x_min: float, x_max: float, y_ref: float,
                      min_value: float = 300.0, y_max: float | None = None) -> tuple[float | None, dict]:
    """製品のX範囲・Y範囲内から「長さ」を1つに絞り込む。

    `y_max`を指定すると、Y範囲の上限をそこで打ち切る(1枚の図面に梁の
    立面が2段に描かれている場合、下段の行から見て上段の行より上は
    別の梁の寸法線なので含めてはいけない。2026-09-14追加)。指定が無い
    場合は従来通り上方向は無制限。

    戻り値: (長さの値 or None, デバッグ情報dict)
    """
    seen_coords = set()
    items = []  # (text, value, x, y, rot, xr, yr)
    for r in tdf.texts:
        text = tdf.resolve_text(r)
        v = _try_float(text)
        if v is None:
            continue
        if not (x_min <= r.x <= x_max and r.y > y_ref and (y_max is None or r.y < y_max)):
            continue
        key = (round(r.x, 1), round(r.y, 1))
        if key in seen_coords:
            continue
        seen_coords.add(key)
        rot = tdf.resolve_rot(r)
        theta = -rot
        xr = r.x * math.cos(theta) - r.y * math.sin(theta)
        yr = r.x * math.sin(theta) + r.y * math.cos(theta)
        items.append((text, v, r.x, r.y, rot, xr, yr))

    if not items:
        return None, {"reason": "no numeric texts in range"}

    # 主軸方向(最頻のrot)を推定。回転行列の計算に使うため、符号を保持した
    # 生の角度(-180〜180)のまま集計する(% 180で丸めると符号情報が失われ、
    # 後段の回転変換が180度近くずれてしまう)。
    # 1/5フィルタ(次のステップ)より前の、絞り込み前の全テキストから求める。
    # 先に1/5フィルタをかけてしまうと、たまたま小さい値ばかりが多い向きの
    # テキストが削られて、残った少数派の向きに主軸が引っ張られることがある
    # (2026-09-14、夢前現場図面WA1-1G-02で確認。フィルタ順序を修正)。
    rot_counts: dict[float, int] = {}
    for _t, _v, _x, _y, rot, _xr, _yr in items:
        key = round(math.degrees(rot), 1)
        rot_counts[key] = rot_counts.get(key, 0) + 1
    main_axis_deg = max(rot_counts.items(), key=lambda kv: kv[1])[0]

    # 範囲内の最大値の1/5未満の値は「取付ピッチ」等の小さい寸法とみなし、
    # 長さ候補から除外する(小さすぎる値がスコアリングで誤って勝つのを防ぐ)。
    max_v = max(v for _t, v, *_ in items)
    threshold = max_v / 5.0
    items = [it for it in items if it[1] >= threshold]
    if not items:
        return None, {"reason": "no items after 1/5 filter"}

    # 出現回数
    occurrence: dict[float, list] = {}
    for text, v, x, y, rot, xr, yr in items:
        occurrence.setdefault(round(v, 2), []).append((x, y))

    # 回転後座標でのグループ化(取付ピッチ系列の検出)
    group_map: dict[tuple, list] = {}
    for text, v, x, y, rot, xr, yr in items:
        key = _axis_key(math.degrees(rot), xr, yr)
        group_map.setdefault(key, []).append((text, v, x, y, xr, yr))

    excluded = set()
    for val, coords in occurrence.items():
        if len(coords) >= 5:
            excluded.add(val)
    for key, members in group_map.items():
        if len(members) >= 3:
            for text, v, x, y, xr, yr in members:
                excluded.add(round(v, 2))

    group_sums = []
    for key, members in group_map.items():
        total = sum(v for text, v, x, y, xr, yr in members)
        group_sums.append((key, total, len(members), [m[0] for m in members]))

    # 除外された値でも他系列合計と一致するなら復活
    revived = set()
    for val in list(excluded):
        for key, total, cnt, texts in group_sums:
            member_vals = {round(_try_float(tx), 2) for tx in texts if _try_float(tx) is not None}
            if val in member_vals:
                continue
            if abs(total - val) < 1.0:
                revived.add(val)
                break

    def line_angle_deg(x1, y1, x2, y2):
        return math.degrees(math.atan2(y2 - y1, x2 - x1)) % 180

    def has_primary_line(val, angle_tol=5.0):
        """ref0==3(実寸法師が自動生成する主要な寸法線)の一致直線が
        1本でもあれば、取付ピッチ等の繰り返し寸法とみなす除外ロジックを
        無視して良いという確実な証拠になる(2026-09-14、EA2-1G-11で、本来
        の長さが他の数値と同じ行に並んでいたために誤って除外されていた
        問題を受けて追加)。"""
        for ln in tdf.lines:
            if ln.ref0 != 3:
                continue
            mid_x = (ln.x1 + ln.x2) / 2
            if not (x_min <= mid_x <= x_max and ln.y1 > y_ref and ln.y2 > y_ref
                    and (y_max is None or (ln.y1 < y_max and ln.y2 < y_max))):
                continue
            if abs(ln.length - val) >= 0.5:
                continue
            ang = line_angle_deg(ln.x1, ln.y1, ln.x2, ln.y2)
            diff = abs(ang - main_axis_deg)
            diff = min(diff, 180 - diff)
            if diff <= angle_tol:
                return True
        return False

    candidates = [
        round(v, 2) for v in occurrence
        if v > min_value and (
            round(v, 2) not in excluded
            or round(v, 2) in revived
            or has_primary_line(round(v, 2))
        )
    ]
    if not candidates:
        return None, {"reason": "no candidates after filtering", "main_axis_deg": main_axis_deg}

    def count_matching_lines(val, angle_tol=5.0):
        cnt = 0
        primary_cnt = 0  # ref0==3(実寸法師が自動生成する主要な寸法線)の本数
        for ln in tdf.lines:
            mid_x = (ln.x1 + ln.x2) / 2
            if not (x_min <= mid_x <= x_max and ln.y1 > y_ref and ln.y2 > y_ref
                    and (y_max is None or (ln.y1 < y_max and ln.y2 < y_max))):
                continue
            if abs(ln.length - val) >= 0.5:
                continue
            ang = line_angle_deg(ln.x1, ln.y1, ln.x2, ln.y2)
            diff = abs(ang - main_axis_deg)
            diff = min(diff, 180 - diff)
            if diff <= angle_tol:
                cnt += 1
                if ln.ref0 == 3:
                    primary_cnt += 1
        return cnt, primary_cnt

    scored = []
    for val in candidates:
        a, primary_cnt = count_matching_lines(val)
        b = sum(1 for key, total, cnt, texts in group_sums if abs(total - val) < 1.0)
        scored.append((val, a, b, primary_cnt))

    # ref0==3の本数(主要寸法線としての一致数)を最優先。同点ならa、さらに同点ならb。
    # ボルトピッチ・リブ等の手動追加線はref0が3以外の値を持つため、これらの
    # 候補は自然と後順位になる(2026-09-14、鳥取現場図面での検証で確立)。
    scored.sort(key=lambda x: (-x[3], -x[1], -x[2]))

    best = scored[0]
    debug = {"main_axis_deg": main_axis_deg, "candidates": scored,
              "threshold": threshold, "max_v": max_v}
    if best[3] == 0 and best[1] == 0:
        # フォールバック(2026-09-14追加): 小梁の斜め材で、寸法テキスト自身の
        # rotが部材の傾きと一致しないケース(EA2-1B-03のEA21-1b2)があり、
        # main_axis_deg(テキストのrot多数決)が誤って0度になってしまい、
        # 本来の長さ(斜め方向の直線)が「主軸不一致」で除外されてしまっていた。
        # この場合に限り、向きを問わず「長さが完全一致する直線の本数」だけで
        # 再スコアリングする(ユーザー確認: EA21-1b2-1/2の正解2688.6は、
        # 向きが斜め[157.17度]の直線が範囲内に7本[最多]あることで裏付けられる)。
        # 通常ケース(大梁48ファイル・小梁の他の行)は最初のスコアリングで
        # 候補が見つかるため、このフォールバックが実行されることはない。
        any_angle_scored = []
        for val, _a, b, _primary_cnt in scored:
            cnt = 0
            primary_cnt = 0
            for ln in tdf.lines:
                mid_x = (ln.x1 + ln.x2) / 2
                if not (x_min <= mid_x <= x_max and ln.y1 > y_ref and ln.y2 > y_ref
                        and (y_max is None or (ln.y1 < y_max and ln.y2 < y_max))):
                    continue
                if abs(ln.length - val) >= 0.5:
                    continue
                cnt += 1
                if ln.ref0 == 3:
                    primary_cnt += 1
            any_angle_scored.append((val, cnt, b, primary_cnt))
        any_angle_scored.sort(key=lambda x: (-x[3], -x[1], -x[2]))
        fallback_best = any_angle_scored[0]
        debug["any_angle_candidates"] = any_angle_scored
        if fallback_best[3] == 0 and fallback_best[1] == 0:
            return None, {**debug, "reason": "no direction-matched line for any candidate"}

        # 採用した値に実際に一致した直線自身の角度を、真の主軸として
        # 採用し直す(2026-09-14追加。フォールバック前のmain_axis_degは
        # テキストのrot多数決による誤った値[0度]のままだったため、
        # 「種別」列[普通梁/斜め梁]の判定にも誤って使われ、EA21-1b2
        # [実際は斜め梁]が「普通梁」と誤表示される不具合があった)。
        matched_angles: dict[float, int] = {}
        for ln in tdf.lines:
            mid_x = (ln.x1 + ln.x2) / 2
            if not (x_min <= mid_x <= x_max and ln.y1 > y_ref and ln.y2 > y_ref
                    and (y_max is None or (ln.y1 < y_max and ln.y2 < y_max))):
                continue
            if abs(ln.length - fallback_best[0]) >= 0.5:
                continue
            ang = round(line_angle_deg(ln.x1, ln.y1, ln.x2, ln.y2), 1)
            matched_angles[ang] = matched_angles.get(ang, 0) + 1
        if matched_angles:
            debug["main_axis_deg"] = max(matched_angles.items(), key=lambda kv: kv[1])[0]

        return fallback_best[0], {**debug, "reason": "axis-less fallback used"}
    return best[0], debug


# ---------------------------------------------------------------------------
# 「左継手・右継手」の判定
# ---------------------------------------------------------------------------

def find_stadium_centers(tdf: tb.TdfData, angle_tol_deg: float = 1.0,
                          radius_tol: float = 0.5, max_dist_factor: float = 20.0):
    """長丸(半径一致・開始角180度差の円弧ペア)の中心座標を全部求める。"""
    arcs = [a for a in tdf.arcs if a.a1 is not None]
    centers = []
    used = set()
    n = len(arcs)
    for i in range(n):
        a = arcs[i]
        if a.offset in used:
            continue
        for j in range(i + 1, n):
            b = arcs[j]
            if b.offset in used:
                continue
            if abs(a.r - b.r) > radius_tol:
                continue
            a1d = math.degrees(a.a1)
            b1d = math.degrees(b.a1)
            diff = abs((a1d - b1d) % 360)
            diff = min(diff, 360 - diff)
            if abs(diff - 180.0) > angle_tol_deg:
                continue
            dist = math.hypot(b.cx - a.cx, b.cy - a.cy)
            if not (0.1 < dist < a.r * max_dist_factor):
                continue
            mid_x = (a.cx + b.cx) / 2
            mid_y = (a.cy + b.cy) / 2
            centers.append((mid_x, mid_y, a.r))
            used.add(a.offset)
            used.add(b.offset)
            break
    return centers


JOINT_CODE_PATTERN = re.compile(r"^GJ")


def determine_joints(tdf: tb.TdfData, x_min: float, x_max: float, y_ref: float,
                      main_axis_deg: float, length_value: float,
                      x_tolerance_factor: float = 0.6,
                      y_max: float | None = None) -> tuple[str | None, str | None]:
    """長丸で囲まれた継手候補のうち、継手コード特有の文字列パターン(`GJ`で
    始まる)に一致するものだけを対象に、製品マーク側(左)・本数セル側(右)の
    それぞれに最も近いものを左右継手として採用する。

    継手コードは図面内で必ず`GJ`始まりであり(`P441`や`TB888`等の無関係な
    部材記号はこのパターンに一致しない)、「N台」パターンと同様に文字列
    そのもので確実に識別できる(2026-09-14、鳥取現場図面での検証で確立)。
    片側にしか継手が無い図面では、該当側の候補が遠すぎる(x_tolerance_factor
    ×lengthを超える)場合にNoneを返す。

    `y_max`を指定すると、長さ判定(determine_length)と同様にY範囲の上限を
    打ち切る(1枚の図面に梁の立面が2段に描かれている場合、下段の行から
    見て上段の行より上にある継手は別の梁のものなので含めてはいけない。
    2026-09-14追加)。
    """
    centers = find_stadium_centers(tdf)
    theta = -math.radians(main_axis_deg)

    def rotate(x, y):
        xr = x * math.cos(theta) - y * math.sin(theta)
        yr = x * math.sin(theta) + y * math.cos(theta)
        return xr, yr

    x_mark_r, _ = rotate(x_min, y_ref)
    x_next_r, _ = rotate(x_max, y_ref)

    joint_candidates = []
    for mx, my, r in centers:
        near = [rec for rec in tdf.texts if abs(rec.x - mx) < 3 and abs(rec.y - my) < 3]
        for rec in near:
            text = tdf.resolve_text(rec)
            if not text or not JOINT_CODE_PATTERN.match(text):
                continue
            if my <= y_ref or (y_max is not None and my >= y_max):
                continue
            xr, yr = rotate(mx, my)
            joint_candidates.append((text, xr))

    if not joint_candidates:
        return None, None

    threshold = length_value * x_tolerance_factor
    left_best = min(joint_candidates, key=lambda c: abs(c[1] - x_mark_r))
    right_best = min(joint_candidates, key=lambda c: abs(c[1] - x_next_r))
    left = left_best[0] if abs(left_best[1] - x_mark_r) <= threshold else None
    right = right_best[0] if abs(right_best[1] - x_next_r) <= threshold else None
    return left, right


# ---------------------------------------------------------------------------
# メイン抽出処理
# ---------------------------------------------------------------------------

RELAX_MARGIN = 5000.0


def extract(path: str) -> list[ProductRow]:
    tdf = tb.load(path)
    drawing_number = find_drawing_number(tdf)
    rows = find_product_rows(tdf)

    for i, row in enumerate(rows):
        if len(rows) == 1:
            # 製品が1種類だけの図面は、他の製品との取り違えリスクが無いため
            # X範囲を左右5000mmずつ緩和し、長さ候補の見落としを減らす。
            x_min = row.x_mark - RELAX_MARGIN
            x_max = row.x_next + RELAX_MARGIN
        else:
            x_min = row.x_mark
            x_max = row.x_next
        y_ref = row.y
        length_value, debug = determine_length(tdf, x_min, x_max, y_ref)
        row.length = length_value
        if length_value is not None:
            main_axis_deg = debug.get("main_axis_deg", 0.0)
            # 継手判定は緩和前の製品自身のマーク/本数セル座標を基準にする
            # (緩和後のx_min/x_maxを使うと、判定基準点が製品本体から
            # 大きくずれて別の候補を誤って拾ってしまう)。
            left, right = determine_joints(
                tdf, row.x_mark, row.x_next, y_ref, main_axis_deg, length_value
            )
            row.left_joint = left
            row.right_joint = right
        row.drawing_number = drawing_number

    return rows


if __name__ == "__main__":
    import sys

    if len(sys.argv) != 2:
        print("使い方: python tdf_master_extractor.py <tdfパス>")
        raise SystemExit(1)

    rows = extract(sys.argv[1])
    dn = find_drawing_number(tb.load(sys.argv[1]))
    print(f"図番: {dn}")
    for r in rows:
        print(f"  製品マーク={r.mark} 設計符号={r.design_code} サイズ={r.size} "
              f"本数={r.count} 重量={r.weight} 長さ={r.length} "
              f"左継手={r.left_joint} 右継手={r.right_joint}")

</script>
<script id="py-tdf-master-extractor-multi" type="text/python-src">
"""実寸法師(.tdf)から製品マスタ情報を抽出するロジックのうち、「1製品に複数
マークが並び、設計符号・サイズを共有する」パターン専用の検出コード。

2026-09-14、小梁(1B系)図面の実機解析で確立。既存の`tdf_master_extractor.py`
(「1マーク=1製品」の大梁パターン、EA1-1G系等で検証済み)には一切手を
加えず、こちらは完全に別コードとして追加する。1つのファイル内に両方の
パターンが混在することがあるため(例: EA1-1B-06)、呼び出し側で両方の
関数を実行して結果をマージすることを想定している。

前提となる図面構造:
  - マークX座標・本数(N台)セルのX座標が完全に一致する行同士を、1つの
    共有テーブルとみなす(隣接する別テーブルはX座標が異なるため混ざらない)。
  - 設計符号・サイズはテーブル内で1回だけ描画され、そのY座標は
    「テーブル内の最大Y・最小Yの中間点((最大Y+最小Y)/2)」に一致する
    (2026-09-14、EA1-1B-01[2行]・EA1-1B-02[3行]・EA1-1B-06[4行]の
    3パターンで検証: いずれも計算値と実測値が完全一致)。
  - ×印で削除された行は、マークセル・本数セルの矩形範囲に対角線が交差する
    斜め線ペア(同じ矩形の対角線同士)が重なっている。これを検出して
    除外する(2026-09-14、EA1-1B-06の-7行[ref0=220069891の斜め線2組]で確認)。
"""
from __future__ import annotations

import math
import re

import tdf_master_extractor as ex
import tdf_binary as tb

_MARK_NUM_PATTERN = re.compile(r"-(\d+)([A-Za-z]?)$")


def mark_sort_key(mark_text: str | None):
    """マーク文字列末尾の「-番号」を数値として昇順に並べるためのキー
    (2026-09-14、共有テーブル内の並び順がY座標の描画順になってしまい、
    -2の次に-1が来る逆順になる不具合を修正)。呼び出し側(extract_to_excel.py
    等)でも、ex.find_product_rows()由来の行とexm由来の行が混在する行を
    最終的に並べ直す際にこのキーを使うこと(片方の関数だけで昇順にしても、
    もう片方の関数が見つけた同じグループの行と混ざると順序が崩れるため)。"""
    if not mark_text:
        return (mark_text or "",)
    m = _MARK_NUM_PATTERN.search(mark_text)
    if not m:
        return (mark_text,)
    return (int(m.group(1)), m.group(2))


def mark_prefix(mark_text: str | None) -> str:
    """マーク文字列から末尾の「-番号」を除いた接頭辞を返す
    (例: "EA12-1B34-4"→"EA12-1B34")。同じ接頭辞を持つマークは、物理的に
    どの表(列・段)に描かれているかに関係なく1つの製品とみなし、番号の
    昇順で並べるために使う(2026-09-14、EA1-1B-06でB34マークが複数の表に
    分かれて描かれていても、全体としては番号順に並べたいという指示)。"""
    if not mark_text:
        return mark_text or ""
    m = _MARK_NUM_PATTERN.search(mark_text)
    if not m:
        return mark_text
    return mark_text[:m.start()]


_AXIS_ALIGN_TOL_DEG = 5.0
_XMARK_CORNER_TOL = 2.0
_SHARED_CODE_Y_TOL = 2.0

# 継手候補の探索閾値の最低保証値。実測データ(95ファイル)で、短い製品
# (300〜1500mm程度)の実在する継手候補までの距離が最大2908.5だったため、
# 余裕を見て3000を採用する(2026-09-14)。
JOINT_MIN_THRESHOLD = 3000.0


def _is_axis_aligned(ln: tb.LineRecord) -> bool:
    ang = math.degrees(math.atan2(ln.y2 - ln.y1, ln.x2 - ln.x1)) % 180
    return ang < _AXIS_ALIGN_TOL_DEG or ang > 180 - _AXIS_ALIGN_TOL_DEG or abs(ang - 90) < _AXIS_ALIGN_TOL_DEG


def _close(p: tuple[float, float], q: tuple[float, float], tol: float) -> bool:
    return abs(p[0] - q[0]) < tol and abs(p[1] - q[1]) < tol


def _forms_x_cross(a: tb.LineRecord, b: tb.LineRecord, tol: float = _XMARK_CORNER_TOL):
    """2本の斜め線が、同じ矩形の対角線同士(=X字)を成すかどうか。"""
    corner1 = (a.x1, a.y2)
    corner2 = (a.x2, a.y1)
    b_pts = [(b.x1, b.y1), (b.x2, b.y2)]
    if (_close(b_pts[0], corner1, tol) and _close(b_pts[1], corner2, tol)) or \
       (_close(b_pts[0], corner2, tol) and _close(b_pts[1], corner1, tol)):
        x0, x1 = sorted((a.x1, a.x2))
        y0, y1 = sorted((a.y1, a.y2))
        return (x0, x1, y0, y1)
    return None


def find_x_marks(tdf: tb.TdfData) -> list[tuple[float, float, float, float]]:
    """ファイル内の全ての×印(削除マーク)の矩形範囲(x0,x1,y0,y1)を求める。"""
    diag = [ln for ln in tdf.lines if not _is_axis_aligned(ln)]
    boxes = []
    used = set()
    n = len(diag)
    for i in range(n):
        if diag[i].offset in used:
            continue
        for j in range(i + 1, n):
            if diag[j].offset in used:
                continue
            box = _forms_x_cross(diag[i], diag[j])
            if box is not None:
                boxes.append(box)
                used.add(diag[i].offset)
                used.add(diag[j].offset)
                break
    return boxes


def _point_in_any_box(x: float, y: float, boxes: list[tuple[float, float, float, float]]) -> bool:
    for x0, x1, y0, y1 in boxes:
        if x0 <= x <= x1 and y0 <= y <= y1:
            return True
    return False


def filter_deleted_rows(tdf: tb.TdfData, rows: list) -> list:
    """マーク・本数セルのどちらかが×印(削除マーク)の矩形範囲内にある行を
    除外する。`find_product_rows_shared_group`は自分が拾った行に対しては
    既にこのチェックを行っているが、`tdf_master_extractor.find_product_rows`
    (1マーク=1製品パターン、設計符号・サイズが自分の行にインラインで
    描かれているケース)には削除マークのチェックが元々無いため、行の
    出どころに関わらず全行に対してここでまとめてチェックする
    (2026-09-14、EA1-1B-08のEA12-1TB489-2[×印済み]がex.find_product_rows
    経由で素通りしていた不具合を修正)。"""
    x_marks = find_x_marks(tdf)
    if not x_marks:
        return rows
    return [
        r for r in rows
        if not (_point_in_any_box(r.x_mark, r.y, x_marks) or _point_in_any_box(r.x_next, r.y, x_marks))
    ]


def _find_shared_code_size(tdf: tb.TdfData, x_min: float, x_max: float, y_lo: float, y_hi: float):
    """テーブルの行のY範囲[y_lo, y_hi]内にある共有設計符号+サイズを探す。

    2026-09-14当初は「(最大Y+最小Y)/2」の1点だけを探していたが、EA2-1B-03
    (阪和ではなく鳥取EA2現場)の列1(-1,-2,-5,-6)で、ラベルが4行全体の中間点
    ではなく先頭2行(-1,-2)の中間点にだけ描かれ、-5/-6専用のラベルは存在しない
    (同じ設計として省略されている)ケースが見つかった。中間点1点への一致
    ではなくグループの行が実際に描かれているY範囲全体を探索するよう緩和する
    (範囲を絞るx_min/x_maxは元々そのグループ専用の列幅のため、他グループの
    ラベルを誤って拾うリスクは低い)。"""
    same_line = [
        r for r in tdf.texts
        if r.rot == 0 and x_min < r.x < x_max
        and y_lo - _SHARED_CODE_Y_TOL <= r.y <= y_hi + _SHARED_CODE_Y_TOL
        and tdf.resolve_text(r)
    ]
    same_line.sort(key=lambda r: r.x)
    if len(same_line) < 2:
        return None, None
    size_rec, code_rec = same_line[-1], same_line[-2]
    size_text = tdf.resolve_text(size_rec)
    if not ex._looks_like_size(size_text):
        return None, None
    return tdf.resolve_text(code_rec), size_text


def find_product_rows_shared_group(
    tdf: tb.TdfData, existing_positions: set[tuple[float, float]] | None = None,
) -> list[ex.ProductRow]:
    """「マーク+本数」だけが行ごとに並び、設計符号・サイズを複数行で共有する
    テーブルパターンを検出する。`existing_positions`には
    `tdf_master_extractor.find_product_rows()`で既に拾われたdaiセルの
    (round(x,1), round(y,1))座標を渡すと、二重集計を避けられる。
    """
    existing_positions = existing_positions or set()
    x_marks = find_x_marks(tdf)

    dai_cells = []
    for r in tdf.texts:
        if r.rot != 0:
            continue
        text = tdf.resolve_text(r)
        if text and tb.is_dai_cell(text):
            key = (round(r.x, 1), round(r.y, 1))
            if key in existing_positions:
                continue
            dai_cells.append(r)

    # 各daiセルについて、同じ行(ex.SAME_ROW_Y_TOLERANCE・X<dai.x)のテキストを
    # 集める。3つ以上あり末尾がサイズらしい場合は「1マーク=1製品」パターンで
    # 既に処理済みのはずなので、ここでは対象にしない(念のためのガード)。
    candidates = []
    for dai in dai_cells:
        same_row = [
            r for r in tdf.texts
            if r.rot == 0 and abs(r.y - dai.y) < ex.SAME_ROW_Y_TOLERANCE and r.x < dai.x and tdf.resolve_text(r)
        ]
        same_row.sort(key=lambda r: r.x)
        if len(same_row) >= 3 and ex._looks_like_size(tdf.resolve_text(same_row[-1])):
            continue
        if not same_row:
            continue
        mark_rec = same_row[-1]
        candidates.append((mark_rec, dai))

    # マークX・本数Xがほぼぴったり一致する行同士を同一テーブルとしてグループ化
    #
    # 注意(2026-09-14): 同じマーク文字列が2箇所に出現することがある
    # (例: EA2-1B-03のEA21-1B35A-5/6は、列1[元の位置]と列3[詳細図の凡例
    # テーブル]の両方に描かれている)。これは「列1の記載を列3に移設した」
    # という設計変更を示す表現で、移設元(列1側)には×印(削除マーク)が
    # 描かれ、移設先(列3側)には描かれていない。ここで文字列の重複を
    # 理由に一方を機械的に除外することはしない。×印が付いている側は
    # 後段の`filter_deleted_rows`/このグループ内の削除チェックで自然に
    # 除外され、×印が無い側(=現在有効な記載)だけが残る。KEY PLAN上の
    # 位置マーカーとの重複(TB577・b2等、どちらも×印は無い)でも、
    # 本体/参照どちらの座標がテーブルの実データとして扱われるべきかは
    # 常に「dai(本数)セルと正しく対になっているか」で決まるため、
    # 文字列の重複だけで除外する判断はしない方が安全。
    groups: dict[tuple[float, float], list[tuple]] = {}
    for mark_rec, dai in candidates:
        key = (round(mark_rec.x, 1), round(dai.x, 1))
        groups.setdefault(key, []).append((mark_rec, dai))

    rows: list[ex.ProductRow] = []
    for _key, members in groups.items():
        # 同じ(マークX,本数X)でも、繰り返しテンプレートにより全く別の
        # フレーム(離れたY位置)にある表が同じ列位置を再利用していることが
        # ある(2026-09-14、EA2-1B-06で、Y3位置のフレーム[-3,-4,-5,-10,
        # -11,-12]とY8位置のフレーム[-17,-18]が同じ列位置になり、1つの
        # 巨大なグループ[Y範囲8500mm超]として誤って統合されて共有ラベルの
        # 検索に失敗し、8マークが丸ごと欠落していた不具合)。Yが大きく
        # 離れている(目安3000mm以上、通常の行間隔240前後に対して十分大きい
        # 閾値)メンバー同士は別の表とみなして分割し、それぞれ独立に
        # 共有設計符号・サイズを探す。
        members_by_y = sorted(members, key=lambda item: item[1].y)
        clusters: list[list[tuple]] = [[members_by_y[0]]]
        for item in members_by_y[1:]:
            if item[1].y - clusters[-1][-1][1].y > 3000.0:
                clusters.append([item])
            else:
                clusters[-1].append(item)

        for cluster in clusters:
            # クラスタキーはグルーピング用に丸めた値なので、検索範囲には
            # 必ず実際の(丸めていない)座標を使う。丸めた値をそのまま使うと、
            # ごくわずかな丸め誤差で本数セル自身が検索範囲に入り込み、
            # 「N台」が末尾(サイズの位置)に来て設計符号・サイズの検出に
            # 失敗することがある(2026-09-14、EA1-1B-08のEA12-1TB489-1が
            # この理由で丸ごと欠落していた不具合を修正)。
            mark_x = cluster[0][0].x
            dai_x = cluster[0][1].x
            ys = [dai.y for _mark, dai in cluster]
            design_code, size_text = _find_shared_code_size(tdf, mark_x, dai_x, min(ys), max(ys))
            if design_code is None:
                continue  # 共有セルが見つからない=未知のパターン。既存挙動どおり無視する

            cluster_sorted = sorted(cluster, key=lambda item: mark_sort_key(tdf.resolve_text(item[0])))
            for mark_rec, dai in cluster_sorted:
                if _point_in_any_box(mark_rec.x, mark_rec.y, x_marks) or _point_in_any_box(dai.x, dai.y, x_marks):
                    continue  # ×印で削除された行

                weight_text = None
                same_row_right = [
                    r for r in tdf.texts
                    if r.rot == 0 and abs(r.y - dai.y) < 100.0 and r.x > dai.x and tdf.resolve_text(r)
                ]
                same_row_right.sort(key=lambda r: r.x)
                if same_row_right:
                    cand = tdf.resolve_text(same_row_right[0])
                    if cand and cand.rstrip().endswith("kg"):
                        weight_text = cand

                rows.append(ex.ProductRow(
                    mark=tdf.resolve_text(mark_rec), design_code=design_code, size=size_text,
                    count=tdf.resolve_text(dai), weight=weight_text,
                    x_mark=mark_rec.x, x_next=dai.x, y=dai.y,
                ))

    rows.sort(key=lambda r: r.x_mark)
    return rows


# ---------------------------------------------------------------------------
# 「継手」の判定(小梁系専用: プレフィックスに頼らない版)
# ---------------------------------------------------------------------------

def _find_reference_line_endpoints(tdf: tb.TdfData, x_min: float, x_max: float, y_ref: float,
                                    y_max: float | None, length_value: float):
    """`determine_length`が採用した長さと一致する直線のうち、行の`y_ref`に
    最も近いものを実際の部材線とみなし、その左右端点の(x, y)座標を返す。

    同じ長さの直線が(別の位置の取付ピッチ・偶然の一致等で)複数見つかる
    ことがあるため、単純な最初の一致ではなくY方向の近さで選ぶ
    (2026-09-14、WA1-1B-03のEA21-1TB788-1/2/3で、無関係な遠いY位置に
    たまたま同じ長さの直線[取付ピッチ等の繰り返し]があり、そのX位置に
    近いという理由だけで別グループの継手候補[TB441]を誤って右継手として
    採用してしまっていた不具合を受けて追加。継手候補は部材の実際の端点の
    近くに描かれるという前提に立ち、以降の距離判定はX方向だけでなく
    実際の端点からの2次元距離で行う)。

    一致する直線が見つからない場合はNoneを返す(呼び出し側はマーク/本数
    セル自身の座標を使う既存の方式にフォールバックする)。
    """
    best = None
    best_dist = None
    for ln in tdf.lines:
        mid_x = (ln.x1 + ln.x2) / 2
        if not (x_min <= mid_x <= x_max and ln.y1 > y_ref and ln.y2 > y_ref
                and (y_max is None or (ln.y1 < y_max and ln.y2 < y_max))):
            continue
        if abs(ln.length - length_value) >= 0.5:
            continue
        mid_y = (ln.y1 + ln.y2) / 2
        dist = abs(mid_y - y_ref)
        if best_dist is None or dist < best_dist:
            best_dist = dist
            best = ln
    if best is None:
        return None
    if best.x1 <= best.x2:
        return (best.x1, best.y1), (best.x2, best.y2)
    return (best.x2, best.y2), (best.x1, best.y1)


def assign_joints_batch(tdf: tb.TdfData, rows: list, tier_info: dict, lengths: dict) -> dict:
    """長丸(スタジアム形状)に囲まれたテキストは全て継手マークの一種である、
    という前提に立つ(2026-09-14、ユーザー確認: 大梁の`GJ`のような専用の
    文字列プレフィックスは無く、小梁では`TB441`や`TB489`等、設計符号と
    同じ文字列がそのまま継手マークとしても使われる)。GJプレフィックスの
    代わりに位置(距離・段のY範囲)だけで判定する。

    ファイル内の行をまとめて渡し、「同じグループ(=同じ(x_mark,x_next)を
    持つ行の集まり。共有テーブルなら複数行、単独行なら1行)」単位で
    継手候補を割り当てる。1つの継手候補は1グループにしか属さない
    (早い者勝ちではなく、複数グループが同じ候補を欲しがった場合は本当に
    距離が近い方が獲得する)。グループ内では候補を共有する(共有テーブルの
    継手は1つしか描かれないため)。

    2026-09-14、EA1-1B-09のEA12-1B34-51(独立グループ)が、実際には別の
    グループ(EA12-1TB489-2)によりふさわしい継手候補をX距離だけで見て
    誤って奪ってしまう不具合と、1グループが複数の候補で「勝利」した際に
    距離を無視して辞書の反復順で上書きされてしまう不具合の両方を修正して
    確立した。

    `tier_info`(id(row) -> (段ラベル, y_max))・`lengths`(id(row) -> 長さ)は
    呼び出し側で計算済みのものを渡すこと。戻り値は id(row) -> (left, right)。
    """
    raw_groups: dict[tuple, list] = {}
    for r in rows:
        key = (round(r.x_mark, 1), round(r.x_next, 1))
        raw_groups.setdefault(key, []).append(r)

    # 同じ列位置(x_mark, x_next)でも、繰り返しテンプレートにより全く別の
    # 段(離れたY位置)の製品が同じ列位置を再利用していることがある
    # (2026-09-14、WA2-1B-10のEA22-1TB489-1[1段]とEA22-1TB441-7[2段]、
    # WA2-1B-01のWA21-1B34-16[1段]とWA21-1B34-26[2段]で確認。列だけで
    # グループ化すると、本来別々の製品なのに継手の結果が強制的に同じに
    # なってしまっていた)。`find_product_rows_shared_group`の表検出と
    # 同様に、Yが大きく離れている(目安3000mm以上)メンバー同士は別の
    # グループとして分割する。
    groups: dict[tuple, list] = {}
    for key, members in raw_groups.items():
        members_by_y = sorted(members, key=lambda r: r.y)
        clusters: list[list] = [[members_by_y[0]]]
        for r in members_by_y[1:]:
            if r.y - clusters[-1][-1].y > 3000.0:
                clusters.append([r])
            else:
                clusters[-1].append(r)
        for i, cluster in enumerate(clusters):
            groups[(key, i)] = cluster

    centers = ex.find_stadium_centers(tdf)
    candidates_raw = []
    for mx, my, _r in centers:
        near = [rec for rec in tdf.texts if abs(rec.x - mx) < 3 and abs(rec.y - my) < 3]
        for rec in near:
            t = tdf.resolve_text(rec)
            if t:
                candidates_raw.append((mx, my, t))

    # (候補位置, テキスト, 側) ごとに、最も近いグループ(と距離)を記録する
    claims: dict[tuple, tuple] = {}
    for key, members in groups.items():
        member_lengths = [lengths[id(r)] for r in members if lengths.get(id(r)) is not None]
        if not member_lengths:
            continue
        length_value = max(member_lengths)
        main_axis_deg = 0.0
        theta = -math.radians(main_axis_deg)

        def rotate(x, y, theta=theta):
            xr = x * math.cos(theta) - y * math.sin(theta)
            yr = x * math.sin(theta) + y * math.cos(theta)
            return xr, yr

        # 長さに比例した閾値だけでは、極端に短い製品(300〜1500mm程度)で
        # 閾値が小さくなりすぎて、実在する継手候補(自分の設計符号と同じ
        # テキスト)まで届かないことがある。継手マークは製品の物理的な
        # 位置からほぼ一定の距離(実測で最大2908.5程度)に描かれるため、
        # 最低保証の閾値を設ける。グループ単位の相互排他により、閾値を
        # 広げても無関係な候補(別の設計符号のテキスト)を誤って奪う
        # リスクは無い(2026-09-14、EA1-1B-09のEA12-1B34-51・
        # EA12-1B29-52/53で確認)。
        threshold = max(length_value * 0.6, JOINT_MIN_THRESHOLD)
        for r in members:
            _tier_label, y_max = tier_info.get(id(r), (None, None))
            row_length = lengths.get(id(r))
            line_endpoints = None
            if row_length is not None:
                line_endpoints = _find_reference_line_endpoints(
                    tdf, r.x_mark, r.x_next, r.y, y_max, row_length,
                )
            if line_endpoints is not None:
                # 実際の部材線の左右端点を基準に、2次元距離(X・Yとも)で
                # 判定する。これにより、X方向だけ近いが実際にはY方向に
                # 大きく離れた(=別の部材の)候補を誤って採用しなくなる。
                (lx, ly), (rx, ry) = line_endpoints
                left_ref, right_ref = (lx, ly), (rx, ry)
                use_2d = True
            else:
                # 部材線が見つからない場合は既存方式(マーク/本数セル自身の
                # X座標、Yは考慮しない)にフォールバックする。
                x_mark_r, _ = rotate(r.x_mark, r.y)
                x_next_r, _ = rotate(r.x_next, r.y)
                left_ref, right_ref = (x_mark_r, None), (x_next_r, None)
                use_2d = False
            for mx, my, t in candidates_raw:
                if my <= r.y or (y_max is not None and my >= y_max):
                    continue
                xr, yr = rotate(mx, my)
                for side, ref in (("left", left_ref), ("right", right_ref)):
                    if use_2d:
                        dist = math.hypot(mx - ref[0], my - ref[1])
                    else:
                        dist = abs(xr - ref[0])
                    if dist > threshold:
                        continue
                    cand_key = (round(mx, 2), round(my, 2), t, side)
                    cur = claims.get(cand_key)
                    if cur is None or dist < cur[0]:
                        claims[cand_key] = (dist, key)

    # 1つのグループが複数の候補で「勝利」することがある(グループ側で他に
    # 競合が無ければ、距離に関係なく全部勝ってしまうため)。各グループ・
    # 各サイドにつき、実際に採用するのは距離が最小の1つだけにする。
    best_per_group_side: dict[tuple, tuple] = {}
    for (_mx, _my, t, side), (dist, key) in claims.items():
        cur = best_per_group_side.get((key, side))
        if cur is None or dist < cur[0]:
            best_per_group_side[(key, side)] = (dist, t)

    group_result: dict[tuple, list] = {}
    for (key, side), (_dist, t) in best_per_group_side.items():
        left_right = group_result.setdefault(key, [None, None])
        left_right[0 if side == "left" else 1] = t

    row_result = {}
    for key, members in groups.items():
        left, right = group_result.get(key, (None, None))
        for r in members:
            row_result[id(r)] = (left, right)
    return row_result

<script id="py-tdf-app" type="text/python-src">
"""ブラウザ(Pyodide)から呼び出すTDF抽出アプリのラッパー。

tdf_binary.py / tdf_master_extractor.py / tdf_master_extractor_multi.py は
一切変更せず、そのままインポートして使う。このファイルはExcel(openpyxl)への
書き込みを行っていた extract_to_excel.py / extract_to_excel_small_beam.py の
「1ファイル分の抽出ロジック」を、dictのリストとして返す形に置き換えただけの
薄いラッパーであり、判定ロジック自体は一切変更していない。

大梁(extract_to_excel.py)・小梁(extract_to_excel_small_beam.py)で
sort_rows / compute_tier_info の実装が微妙に異なる(小梁側にのみ
「直上の段で同じ列の行だけを対象にy_maxを計算する」補正が入っている)ため、
それぞれ元のスクリプトの実装をそのまま個別関数として維持している。
"""
from __future__ import annotations

import math

import tdf_binary as tb
import tdf_master_extractor as ex
import tdf_master_extractor_multi as exm

HEADERS = [
    "ID", "図番", "製品マーク", "設計符号", "サイズ", "本数",
    "長さ(m)", "重量", "左継手", "右継手", "種別", "製品段",
]

_AXIS_TOLERANCE_DEG = 2.0
TIER_Y_GAP_THRESHOLD = 3000.0


def classify_beam_type(main_axis_deg: float | None) -> str | None:
    if main_axis_deg is None:
        return None
    remainder = abs(main_axis_deg) % 90.0
    if remainder <= _AXIS_TOLERANCE_DEG or remainder >= 90.0 - _AXIS_TOLERANCE_DEG:
        return "普通梁"
    return "斜め梁"


# ---------------------------------------------------------------------------
# 大梁(1G系) — extract_to_excel.py の1ファイル分の処理をそのまま移植
# ---------------------------------------------------------------------------

def _sort_rows_large(rows: list) -> None:
    prefix_max_y: dict[str, float] = {}
    prefix_min_x: dict[str, float] = {}
    for r in rows:
        p = exm.mark_prefix(r.mark)
        prefix_max_y[p] = max(prefix_max_y.get(p, r.y), r.y)
        prefix_min_x[p] = min(prefix_min_x.get(p, r.x_mark), r.x_mark)

    def key_func(r):
        p = exm.mark_prefix(r.mark)
        return (-prefix_max_y[p], prefix_min_x[p], exm.mark_sort_key(r.mark))

    rows.sort(key=key_func)


def _compute_tier_info_large(rows: list) -> dict:
    if not rows:
        return {}
    sorted_rows = sorted(rows, key=lambda r: -r.y)
    tiers = [[sorted_rows[0]]]
    for r in sorted_rows[1:]:
        if tiers[-1][-1].y - r.y > TIER_Y_GAP_THRESHOLD:
            tiers.append([r])
        else:
            tiers[-1].append(r)
    info = {}
    for i, tier in enumerate(tiers):
        tier_label = f"{i + 1}段"
        y_max = None if i == 0 else min(r.y for r in tiers[i - 1])
        for r in tier:
            info[id(r)] = (tier_label, y_max)
    return info


# 継手判定(大梁専用)。2026-09-14当初は「GJで始まるテキストのみ継手候補」
# だったが、WA2-3G-05でGJ以外の継手コード(GW100G)が見つかったため、小梁と
# 同じ「長丸で囲まれたテキストは全て継手マークの一種」という前提に切り替えた
# (masamizsumi-dotcom/tdf-master-extract の extract_to_excel.py と同一ロジック)。
# 大梁の図面では長丸が柱マーク(P441等)も囲むことがあるため、その柱マークが
# 近傍(1000mm以内)に円で囲まれていない形でも重複して描かれている場合は
# 除外する(_has_nearby_duplicate)。
NEARBY_DUP_RANGE = 1000.0


def _has_nearby_duplicate(tdf: tb.TdfData, mx: float, my: float, text: str) -> bool:
    for rec in tdf.texts:
        if abs(rec.x - mx) < 3 and abs(rec.y - my) < 3:
            continue  # 長丸内の自分自身は除く
        if abs(rec.x - mx) > NEARBY_DUP_RANGE or abs(rec.y - my) > NEARBY_DUP_RANGE:
            continue
        other = tdf.resolve_text(rec)
        if not other:
            continue
        if other.strip().isdigit():
            continue  # 寸法値等の純粋な数値は比較対象外
        if other == text or text in other or other in text:
            return True
    return False


def _assign_joints_batch_large(tdf: tb.TdfData, rows: list, tier_info: dict, lengths: dict) -> dict:
    raw_groups: dict[tuple, list] = {}
    for r in rows:
        key = (round(r.x_mark, 1), round(r.x_next, 1))
        raw_groups.setdefault(key, []).append(r)

    groups: dict[tuple, list] = {}
    for key, members in raw_groups.items():
        members_by_y = sorted(members, key=lambda r: r.y)
        clusters: list[list] = [[members_by_y[0]]]
        for r in members_by_y[1:]:
            if r.y - clusters[-1][-1].y > TIER_Y_GAP_THRESHOLD:
                clusters.append([r])
            else:
                clusters[-1].append(r)
        for i, cluster in enumerate(clusters):
            groups[(key, i)] = cluster

    centers = ex.find_stadium_centers(tdf)
    candidates_raw = []
    for mx, my, _r in centers:
        near = [rec for rec in tdf.texts if abs(rec.x - mx) < 3 and abs(rec.y - my) < 3]
        for rec in near:
            t = tdf.resolve_text(rec)
            if not t:
                continue
            if _has_nearby_duplicate(tdf, mx, my, t):
                continue
            candidates_raw.append((mx, my, t))

    claims: dict[tuple, tuple] = {}
    for key, members in groups.items():
        member_lengths = [lengths[id(r)] for r in members if lengths.get(id(r)) is not None]
        if not member_lengths:
            continue
        length_value = max(member_lengths)
        main_axis_deg = 0.0
        theta = -math.radians(main_axis_deg)

        def rotate(x, y, theta=theta):
            xr = x * math.cos(theta) - y * math.sin(theta)
            yr = x * math.sin(theta) + y * math.cos(theta)
            return xr, yr

        threshold = max(length_value * 0.6, exm.JOINT_MIN_THRESHOLD)
        for r in members:
            _tier_label, y_max = tier_info.get(id(r), (None, None))
            row_length = lengths.get(id(r))
            line_endpoints = None
            if row_length is not None:
                line_endpoints = exm._find_reference_line_endpoints(
                    tdf, r.x_mark, r.x_next, r.y, y_max, row_length,
                )
            if line_endpoints is not None:
                (lx, ly), (rx, ry) = line_endpoints
                left_ref, right_ref = (lx, ly), (rx, ry)
                use_2d = True
            else:
                x_mark_r, _ = rotate(r.x_mark, r.y)
                x_next_r, _ = rotate(r.x_next, r.y)
                left_ref, right_ref = (x_mark_r, None), (x_next_r, None)
                use_2d = False
            for mx, my, t in candidates_raw:
                if my <= r.y or (y_max is not None and my >= y_max):
                    continue
                xr, yr = rotate(mx, my)
                for side, ref in (("left", left_ref), ("right", right_ref)):
                    if use_2d:
                        dist = math.hypot(mx - ref[0], my - ref[1])
                    else:
                        dist = abs(xr - ref[0])
                    if dist > threshold:
                        continue
                    cand_key = (round(mx, 2), round(my, 2), t, side)
                    cur = claims.get(cand_key)
                    if cur is None or dist < cur[0]:
                        claims[cand_key] = (dist, key)

    best_per_group_side: dict[tuple, tuple] = {}
    for (_mx, _my, t, side), (dist, key) in claims.items():
        cur = best_per_group_side.get((key, side))
        if cur is None or dist < cur[0]:
            best_per_group_side[(key, side)] = (dist, t)

    group_result: dict[tuple, list] = {}
    for (key, side), (_dist, t) in best_per_group_side.items():
        left_right = group_result.setdefault(key, [None, None])
        left_right[0 if side == "left" else 1] = t

    row_result = {}
    for key, members in groups.items():
        left, right = group_result.get(key, (None, None))
        for r in members:
            row_result[id(r)] = (left, right)
    return row_result


def _extract_large_beam(tdf: tb.TdfData) -> list[dict]:
    drawing_number = ex.find_drawing_number(tdf)
    rows = ex.find_product_rows(tdf)
    existing_dai_positions = {(round(r.x_next, 1), round(r.y, 1)) for r in rows}
    rows = rows + exm.find_product_rows_shared_group(tdf, existing_positions=existing_dai_positions)
    _sort_rows_large(rows)
    tier_info = _compute_tier_info_large(rows)

    lengths: dict[int, float | None] = {}
    beam_types: dict[int, str | None] = {}
    for row in rows:
        _tier_label, tier_y_max = tier_info.get(id(row), (None, None))
        if len(rows) == 1:
            x_min = row.x_mark - ex.RELAX_MARGIN
            x_max = row.x_next + ex.RELAX_MARGIN
        else:
            x_min = row.x_mark
            x_max = row.x_next
        length_value, debug = ex.determine_length(tdf, x_min, x_max, row.y, y_max=tier_y_max)
        lengths[id(row)] = length_value
        beam_types[id(row)] = classify_beam_type(
            debug.get("main_axis_deg") if length_value is not None else None
        )

    joints = _assign_joints_batch_large(tdf, rows, tier_info, lengths)

    out = []
    for row in rows:
        tier_label, _tier_y_max = tier_info.get(id(row), (None, None))
        length_value = lengths[id(row)]
        left, right = joints.get(id(row), (None, None))
        if length_value is None:
            left = right = None
        # 記録はm単位(内部の判定ロジックはmm前提のまま、出力直前だけ変換)。
        # masamizsumi-dotcom/tdf-master-extract の同種の変更に合わせたもの。
        length_value_m = None if length_value is None else length_value / 1000.0
        out.append({
            "図番": drawing_number, "製品マーク": row.mark, "設計符号": row.design_code,
            "サイズ": row.size, "本数": row.count, "長さ": length_value_m, "重量": row.weight,
            "左継手": left, "右継手": right, "種別": beam_types[id(row)], "製品段": tier_label,
        })
    return out


# ---------------------------------------------------------------------------
# 小梁(1B系) — extract_to_excel_small_beam.py の1ファイル分の処理をそのまま移植
# ---------------------------------------------------------------------------

def _get_rows_small(tdf: tb.TdfData) -> list:
    rows = ex.find_product_rows(tdf)
    existing = {(round(r.x_next, 1), round(r.y, 1)) for r in rows}
    rows = rows + exm.find_product_rows_shared_group(tdf, existing_positions=existing)
    rows = exm.filter_deleted_rows(tdf, rows)
    return rows


def _sort_rows_small(rows: list) -> None:
    _sort_rows_large(rows)  # ロジックは大梁側と同一


def _compute_tier_info_small(rows: list) -> dict:
    if not rows:
        return {}
    sorted_rows = sorted(rows, key=lambda r: -r.y)
    tiers = [[sorted_rows[0]]]
    for r in sorted_rows[1:]:
        if tiers[-1][-1].y - r.y > TIER_Y_GAP_THRESHOLD:
            tiers.append([r])
        else:
            tiers[-1].append(r)

    info = {}
    for i, tier in enumerate(tiers):
        tier_label = f"{i + 1}段"
        if i == 0:
            for r in tier:
                info[id(r)] = (tier_label, None)
            continue
        prev_tier = tiers[i - 1]
        global_y_max = min(r.y for r in prev_tier)
        for r in tier:
            same_col = [
                pr for pr in prev_tier
                if max(r.x_mark, pr.x_mark) < min(r.x_next, pr.x_next)
            ]
            y_max = min(pr.y for pr in same_col) if same_col else global_y_max
            info[id(r)] = (tier_label, y_max)
    return info


def _extract_small_beam(tdf: tb.TdfData) -> list[dict]:
    drawing_number = ex.find_drawing_number(tdf)
    rows = _get_rows_small(tdf)
    if not rows:
        return []

    _sort_rows_small(rows)
    tier_info = _compute_tier_info_small(rows)

    lengths: dict[int, float | None] = {}
    beam_types: dict[int, str | None] = {}
    for row in rows:
        _tier_label, tier_y_max = tier_info.get(id(row), (None, None))
        if len(rows) == 1:
            x_min = row.x_mark - ex.RELAX_MARGIN
            x_max = row.x_next + ex.RELAX_MARGIN
        else:
            x_min = row.x_mark
            x_max = row.x_next
        length_value, debug = ex.determine_length(tdf, x_min, x_max, row.y, y_max=tier_y_max)
        lengths[id(row)] = length_value
        beam_types[id(row)] = classify_beam_type(
            debug.get("main_axis_deg") if length_value is not None else None
        )

    joints = exm.assign_joints_batch(tdf, rows, tier_info, lengths)

    out = []
    for row in rows:
        tier_label, _y_max = tier_info.get(id(row), (None, None))
        length_value = lengths[id(row)]
        left, right = joints.get(id(row), (None, None))
        if length_value is None:
            left = right = None
        # 記録はm単位(内部の判定ロジックはmm前提のまま、出力直前だけ変換)。
        # masamizsumi-dotcom/tdf-master-extract の同種の変更に合わせたもの。
        length_value_m = None if length_value is None else length_value / 1000.0
        out.append({
            "図番": drawing_number, "製品マーク": row.mark, "設計符号": row.design_code,
            "サイズ": row.size, "本数": row.count, "長さ": length_value_m, "重量": row.weight,
            "左継手": left, "右継手": right, "種別": beam_types[id(row)], "製品段": tier_label,
        })
    return out


# ---------------------------------------------------------------------------
# JS側から呼び出すエントリポイント
# ---------------------------------------------------------------------------

_last_extract_info: dict = {}


def extract_file(path: str, beam_type: str) -> list[dict]:
    """1つの.tdfファイルを解析して製品情報のリスト(dict)を返す。

    beam_type: "large"(大梁・1G系) または "small"(小梁・1B系)。
    """
    global _last_extract_info
    tdf = tb.load(path)
    if beam_type == "small":
        rows = _extract_small_beam(tdf)
    else:
        rows = _extract_large_beam(tdf)

    _last_extract_info = {
        "no_product_table_found": len(rows) == 0,
    }
    return rows
