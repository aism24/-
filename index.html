<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAS API サンプルフロントエンド</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <header class="app__header">
    <h1>メッセージボード</h1>
    <p>GitHub Pages（フロントエンド）&harr; GAS API（バックエンド）連携サンプル</p>
  </header>

  <div id="errorBanner" class="error-banner" role="alert">
    <span id="errorMessage"></span>
    <button type="button" id="errorClose" aria-label="閉じる">&times;</button>
  </div>

  <section class="card">
    <h2>投稿する</h2>
    <form id="postForm" novalidate>
      <div class="form-field">
        <label for="name">お名前</label>
        <input type="text" id="name" name="name" maxlength="40" required>
      </div>
      <div class="form-field">
        <label for="message">メッセージ</label>
        <textarea id="message" name="message" rows="3" maxlength="500" required></textarea>
      </div>
      <button type="submit" class="btn" id="submitBtn">
        <span id="submitSpinner" class="spinner" style="display:none;"></span>
        <span id="submitLabel">送信する</span>
      </button>
    </form>
  </section>

  <section class="card">
    <div class="status-row">
      <h2 style="margin:0;flex:1;">投稿一覧</h2>
      <button type="button" class="btn btn--ghost" id="reloadBtn">再読み込み</button>
    </div>
    <div id="loading" class="status-row" style="display:none;">
      <span class="spinner spinner--muted"></span>
      <span>読み込み中...</span>
    </div>
    <ul id="list" class="list"></ul>
    <div id="emptyState" class="empty-state" style="display:none;">まだ投稿がありません。</div>
  </section>
</div>

<script src="app.js"></script>
</body>
</html>
