<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コスト-インサイト</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --bg:#2b2c2f; --card:#fff; --ink:#000; --sub:#222; --muted:#555; --line:#e1e0d9; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif; }
  /* アプリ名は中央、会社ロゴと社名は右端 */
  header { background:var(--card); padding:12px 16px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; }
  header h1 { grid-column:2; text-align:center; }
  .brand { grid-column:3; justify-self:end; display:flex; align-items:center; gap:10px; }
  @media (max-width: 700px) { header { grid-template-columns:1fr; } header h1, .brand { grid-column:1; justify-self:center; } .brand { order:-1; } }
  .logo { height:40px; width:auto; }
  .logo-mark { fill:#e60012; } .logo-text { fill:#222; }
  .company { font-size:21px; color:#000; white-space:nowrap; }
  h1 { font-size:20px; margin:0; }
  h1 small { font-size:12px; color:var(--sub); font-weight:normal; margin-left:6px; }
  main { max-width:1280px; margin:20px auto; padding:0 16px; }
  .card { background:var(--card); border-radius:8px; padding:16px 20px; }
  .card + .card { margin-top:16px; }
  .card h2 { font-size:16px; margin:0 0 10px; }
  .note { color:var(--sub); font-size:13px; margin:8px 0 0; }
  /* 絞り込み(1行) */
  #filters { display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; font-size:14px; }
  #filters select, #filters input[type=date] { font:inherit; padding:3px 6px; }
  #filters fieldset { border:0; padding:0; margin:0; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .tabs { display:flex; gap:4px; margin:14px 0 0; border-bottom:2px solid #e60012; }
  .tab { font:inherit; font-size:15px; font-weight:bold; padding:8px 22px; border:0; border-radius:6px 6px 0 0; background:#eee; color:#444; cursor:pointer; }
  .tab.on { background:#e60012; color:#fff; }
  /* KPI */
  #kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:10px; }
  .kpi { border:1px solid var(--line); border-radius:6px; padding:10px 12px; }
  .kpi-l { font-size:12px; color:var(--sub); }
  .kpi-v { font-size:22px; font-weight:bold; margin-top:2px; }
  .kpi-v small { font-size:12px; font-weight:normal; color:var(--sub); margin-left:3px; }
  .kpi-s { font-size:12px; color:var(--sub); margin-top:2px; }
  /* グラフ */
  .charts { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .chart-box h3 { font-size:14px; margin:0 0 6px; }
  .chart-wrap { position:relative; height:280px; }
  .chart-box.wide { grid-column:1 / -1; }
  @media (max-width: 800px) { .charts { grid-template-columns:1fr; } }
  /* 表 */
  .tbl-wrap { overflow:auto; max-height:70vh; margin-top:8px; }
  table { border-collapse:collapse; font-size:13px; }
  th, td { border:1px solid #ddd; padding:4px 8px; white-space:nowrap; text-align:left; }
  th { background:#f3f3f3; position:sticky; top:0; z-index:1; }
  td.n, th.n { text-align:right; }
  td.neg { color:#c62828; }
  td.note-cell { white-space:normal; min-width:260px; max-width:420px; font-size:12px; color:#a15c00; }
  tr.warnrow td { background:#fffbe6; }
  tr.total td { font-weight:bold; background:#f7f7f7; }
  #set-table tr.changed td { background:#fff3c4; }
  #set-table td.c { text-align:center; }
  #set-table { margin:0 auto; }
  /* 文字は黒(グレーは見にくいため) */
  table, th, td, select, .note { color:#000; }
  #set-table td, #set-table select { font-weight:bold; color:#000; }
  #set-table th { text-align:center; }
  #set-table select { font:inherit; color:#000; padding:2px 6px; border:1px solid #888; border-radius:4px; text-align:center; text-align-last:center; }
  /* 年度の色(実行予算まとめと同じ: R8=青・R9=緑・R10=ピンク・R7=黄 の4色周期。未設定は色なし) */
  #set-table select.y0 { background:#d6e9ff; }
  #set-table select.y1 { background:#d8f3dc; }
  #set-table select.y2 { background:#ffd9e6; }
  #set-table select.y3 { background:#fff3a8; }
  #set-box summary { cursor:pointer; font-size:15px; }
  .btn:disabled { background:#bbb; cursor:default; }
  .est { display:inline-block; font-size:10px; color:#a15c00; border:1px solid #e0b060; border-radius:3px; padding:0 3px; margin-left:4px; vertical-align:1px; }
  #notes { font-size:12px; color:var(--sub); margin:10px 0 0; padding-left:1.3em; line-height:1.7; }
  /* 実行予算の取り込み */
  .btn { display:inline-block; background:#e60012; color:#fff; text-decoration:none; font-weight:bold;
         padding:10px 20px; border-radius:6px; margin:4px 8px 4px 0; border:0; font-size:14px; cursor:pointer; font-family:inherit; }
  .btn.sub { background:#555; }
  .btn.pink { background:#ec4899; }
  .btn.blue { background:#2563eb; }
  .btn.orange { background:#f97316; }
  .btn.orange:hover { background:#ea580c; }
  .home-row { text-align:center; margin:0 0 12px; }
  .home-row .stack-btn { width:min(340px, 100%); font-size:16px; padding:14px 20px; margin:0; }
  .btn.blue:disabled { background:#bbb; }
  .btn.pink:hover { background:#db2777; }
  /* 取込完了のお知らせ(2秒表示してホームへ戻る) */
  #toast { position:fixed; inset:0; background:rgba(40,40,40,.45); display:flex; align-items:center; justify-content:center; z-index:110; }
  #toast[hidden] { display:none; }
  #toast div { background:#fff; border-radius:10px; padding:26px 34px; font-size:18px; font-weight:bold; color:#166534;
               border:3px solid #86efac; box-shadow:0 8px 30px rgba(0,0,0,.35); max-width:calc(100% - 32px); text-align:center; }
  .reg-next { display:inline-block; background:#fff200; color:#222; font-weight:bold; padding:10px 16px;
              border:2px solid #ff9800; border-radius:6px; font-size:14px; vertical-align:middle; margin:4px 0;
              animation:reg-blink 1s ease-in-out infinite; }
  @keyframes reg-blink {
    0%, 100% { background:#fff200; border-color:#ff9800; box-shadow:0 0 4px 1px #ffb300, 0 0 14px 5px rgba(255,152,0,.85); }
    50% { background:#fffbd0; border-color:#ffe0a0; box-shadow:0 0 0 0 rgba(255,152,0,0); }
  }
  /* 読み込み中のポップアップ(読み込み完了までは画面全体をグレーアウト) */
  #loading { position:fixed; inset:0; background:rgba(40,40,40,.6); display:flex; align-items:center; justify-content:center; z-index:100; }
  #loading.done { display:none; }
  .ld-box { background:#fff; border-radius:10px; padding:24px 28px; width:min(420px, calc(100% - 32px)); text-align:center; box-shadow:0 8px 30px rgba(0,0,0,.35); }
  .ld-title { font-size:18px; font-weight:bold; margin:0 0 14px; }
  .ld-bar { height:14px; background:#eee; border-radius:7px; overflow:hidden; }
  .ld-fill { height:100%; width:0; background:linear-gradient(90deg, #e60012, #ff6b6b, #e60012); background-size:200% 100%;
             animation:ld-flow 1.2s linear infinite; transition:width .4s ease; }
  @keyframes ld-flow { from { background-position:200% 0; } to { background-position:0 0; } }
  .ld-sub { font-size:13px; color:var(--sub); margin:10px 0 0; }
  .ld-err { color:#c62828; font-size:14px; margin:12px 0 0; }
  /* メニュー(3つのボタン)と各モード */
  .view[hidden] { display:none; }
  /* 1行目: 進捗確認(2列分の幅・大きめ) / 2行目: 実行予算取込・完了年度設定(同じ幅) */
  .menu { display:grid; grid-template-columns:1fr 1fr; gap:12px; max-width:620px; margin:0 auto; }
  .menu-btn.wide { grid-column:1 / -1; font-size:22px; padding:24px 12px; }
  @media (max-width: 520px) { .menu { grid-template-columns:1fr; } }
  /* メニューのボタンは薄い色で色分け(赤は危険を表す色として使わない) */
  .menu-btn { font:inherit; font-size:18px; font-weight:bold; color:#1f2a37; border:2px solid transparent; border-radius:10px;
              padding:17px 12px; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.25); transition:filter .15s, transform .15s; }
  .menu-btn.m1 { background:#dbeafe; border-color:#93c5fd; }
  .menu-btn.m2 { background:#dcfce7; border-color:#86efac; }
  .menu-btn.m3 { background:#ede9fe; border-color:#c4b5fd; }
  .menu-btn:hover:not(:disabled) { filter:brightness(1.04); transform:translateY(-2px); }
  .menu-btn:disabled { background:#999; border-color:#999; color:#ddd; cursor:default; }
  .back { font:inherit; font-size:14px; background:#fff; color:#222; border:0; border-radius:6px; padding:8px 16px; margin:0 0 12px; cursor:pointer; }
  .step { border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-top:12px; }
  .imp-status { font-size:14px; font-weight:bold; margin:6px 0 0; padding:8px 12px; border-radius:6px; background:#eef4ff; color:#1f3a8a; }
  .imp-status.ok { background:#e8f7ee; color:#166534; }
  .imp-status.ng { background:#fff4e5; color:#9a3412; }
  /* 白いカードは中身(ボタン・表)+余白の幅にして中央に置く */
  .budget-stack { display:flex; flex-direction:column; align-items:center; justify-content:flex-start; text-align:center;
                  width:fit-content; min-width:min(380px, 100%); max-width:100%; margin-left:auto; margin-right:auto; }
  .budget-stack h2 { align-self:stretch; text-align:left; }
  .budget-stack .stack-btn, .budget-stack .reg-next { width:min(340px, 100%); margin:6px 0; text-align:center; font-size:16px; padding:14px 20px; }
  /* 完了年度設定: 左 更新を保存・右 ホームへ戻る(同じ幅、高さは縦並びのときの半分) */
  /* 注意書き: 赤文字・黄色の背景で点滅 */
  .warn-blink { align-self:stretch; margin:0; padding:4px 8px; border-radius:4px 4px 0 0; text-align:left;
                color:#d00000; font-weight:bold; font-size:14px; animation:warn-blink 1s ease-in-out infinite; }
  .warn-blink[hidden] { display:none; }
  .warn-blink + .tbl-wrap { margin-top:0; }
  #set-msg { margin:0 0 6px; }
  #set-msg:empty { display:none; }
  @keyframes warn-blink { 0%, 100% { background:#fff200; } 50% { background:#fffbd0; } }
  .btn-row { align-self:stretch; display:flex; gap:10px; margin:4px 0 8px; }
  .btn-row .btn { flex:1 1 0; margin:0; padding:4px 10px; font-size:14px; line-height:1.4; }
  .budget-stack .imp-status { width:min(340px, 100%); }
  .step h3 { font-size:15px; margin:0 0 6px; }
</style>
</head>
<body>
<header>
  <h1>コスト-インサイト<small>生産・原価の進捗管理</small></h1>

    <div class="company">株式会社　正光</div>
  </div>
</header>
<main>
  <!-- メニュー(読み込みが終わるまでボタンは押せない) -->
  <section id="v-menu" class="view">
    <div class="menu">
      <button class="menu-btn m3 wide" type="button" data-go="progress" disabled>進捗確認</button>
      <button class="menu-btn m1" type="button" data-go="budget" disabled>実行予算取込</button>
      <button class="menu-btn m2" type="button" data-go="settings" disabled>完了年度設定</button>
    </div>
  </section>

  <!-- 実行予算取込モード -->
  <section id="v-budget" class="view" hidden>
    <!-- 3つのボタンを縦に並べ、上合わせ・中央揃え -->
    <div class="card budget-stack">
      <h2>実行予算取込</h2>
      <button class="btn orange stack-btn" type="button" data-go="menu">ホームへ戻る</button>
      <button id="regBtn" class="btn sub stack-btn" type="button" onclick="downloadReg()" title="PCごとに1回だけ。ダウンロードした 正光コストインサイト登録.reg をダブルクリックで開き、［はい］→［OK］">①初期設定をダウンロード</button>
      <a class="btn pink stack-btn" href="costinsight://update" onclick="startImportWatch()" title="会社サーバーの 実行予算更新.bat を実行します(社内ネットワークのPCのみ)">②実行予算取込</a>
      <p id="imp-status" class="imp-status" hidden></p>
      <p id="budget" class="note">前回取込: 確認中…</p>
    </div>
  </section>

  <!-- 工事別＿完了｜年度設定モード -->
  <section id="v-settings" class="view" hidden>
    <!-- ホームへ戻る・更新を保存(中央揃え)の下に表 -->
    <div class="card budget-stack">
      <h2>完了年度設定</h2>
      <div class="btn-row">
        <button id="set-save" class="btn blue" type="button" onclick="saveSettings()" disabled>更新を保存</button>
        <button class="btn orange" type="button" data-go="menu">ホームへ戻る</button>
      </div>
      <span id="set-msg" class="note"></span>
      <p id="warn-hist" class="warn-blink" hidden>生産管理のデータは2025/8/21からしかありません。</p>
      <div class="tbl-wrap"><table id="set-table"></table></div>
    </div>
  </section>

  <!-- 進捗確認 -->
  <section id="v-progress" class="view" hidden>
    <p class="home-row"><button class="btn orange stack-btn" type="button" data-go="menu">ホームへ戻る</button></p>
    <div class="card">
      <div id="filters">
        <fieldset><b>期間</b>
          <label><input type="radio" name="f-mode" value="fy" checked> 期</label><select id="f-fy"></select>
          <label><input type="radio" name="f-mode" value="period"> 月度</label><select id="f-period"></select>
          <label><input type="radio" name="f-mode" value="range"> 任意</label><input type="date" id="f-from"> 〜 <input type="date" id="f-to">
        </fieldset>
        <fieldset><b>工場</b> <span id="f-sites"></span></fieldset>
        <label><input type="checkbox" id="f-done"> 完了の工事のみ</label>
      </div>
      <p class="note"><span id="range-note"></span> (<span id="f-min"></span> より前は生産重量のデータが無いため選べません)</p>
      <div class="tabs">
        <button class="tab on" type="button" data-tab="work">工事別</button>
        <button class="tab" type="button" data-tab="site">工場別</button>
        <button class="tab" type="button" data-tab="period">期間別</button>
      </div>
    </div>
    <div class="card">
      <div id="kpis"></div>
      <p id="status" class="note"></p>
    </div>
    <div class="card">
      <div class="charts">
        <div class="chart-box"><h3>1t当たり単価(加工単価・仕入単価)</h3><div class="chart-wrap"><canvas id="c-ton"></canvas></div></div>
        <div class="chart-box"><h3>1時間当たり単価</h3><div class="chart-wrap"><canvas id="c-hour"></canvas></div></div>
        <div class="chart-box wide"><h3>損益(万円)</h3><div class="chart-wrap"><canvas id="c-profit"></canvas></div></div>
      </div>
    </div>
    <div class="card">
      <div class="tbl-wrap"><table id="table"></table></div>
      <ul id="notes"></ul>
    </div>
  </section>
</main>
<!-- 取込完了のお知らせ -->
<div id="toast" role="alert" hidden><div>実行予算取込完了＿ホームに戻ります</div></div>
<!-- 読み込み中のポップアップ -->
<div id="loading" role="dialog" aria-live="polite">
  <div class="ld-box">
    <p class="ld-title" id="ld-title">データ読込中…</p>
    <div class="ld-bar"><div class="ld-fill" id="ld-fill"></div></div>
    <p class="ld-sub" id="ld-sub">0% ・ 0秒</p>
    <p class="ld-sub">初回は30秒ほどかかることがあります</p>
    <p class="ld-err" id="ld-err" hidden></p>
  </div>
</div>
<script src="calc.js"></script>
<script src="app.js"></script>
</body>
</html>
