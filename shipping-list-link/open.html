<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>実寸法師で開く</title>
<style>
body{margin:0;background:#000;color:#e6eaf2;font:15px/1.7 system-ui,"Hiragino Sans","Yu Gothic",sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px}
.box{max-width:460px;width:100%;background:#0b0f16;border:1px solid #2a3342;border-radius:14px;padding:26px 24px;text-align:center}
h1{font-size:18px;margin:0 0 10px}.path{font-size:12px;color:#8a94a6;word-break:break-all;margin:10px 0 16px}
a.btn{display:inline-block;background:#58a6ff;color:#000;font-weight:bold;text-decoration:none;padding:10px 26px;border-radius:8px;font-size:16px}
.note{font-size:12px;color:#8a94a6;margin-top:14px}.err{color:#e0a458;font-weight:bold}
</style></head><body><div class="box" id="box"><h1>実寸法師で開きます</h1><div id="body">読み込み中…</div></div>
<script>
(function () {
  // 社内ネットワーク(プライベートIP)の .tdf だけを許可する(外部へ飛ばされる悪用の防止)
  var OK = /^(192\.168\.\d{1,3}\.\d{1,3}|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\/.+\.tdf$/i;
  var p = new URLSearchParams(location.search).get('p') || '';
  var body = document.getElementById('body');
  if (!OK.test(p)) { body.innerHTML = '<div class="err">開けないリンクです</div><div class="note">社内サーバー(192.168.x.x 等)の .tdf のみ開けます。</div>'; return; }
  var target = 'jissun://' + p.split('/').map(function (s) { return encodeURIComponent(s).replace(/\(/g, '%28').replace(/\)/g, '%29'); }).join('/');
  var file = p.split('/').pop();
  body.innerHTML = '<div class="path"></div><a class="btn" id="go">開く</a><div class="note">ブラウザの確認が出たら「開く」を押してください。<br>開いたあと、このタブは閉じて構いません。</div>';
  body.querySelector('.path').textContent = file;
  document.getElementById('go').href = target;
  // 自動で起動を試みる(ブロックされた場合は上の「開く」ボタンを押す)
  setTimeout(function () { location.href = target; }, 300);
})();
</script></body></html>
