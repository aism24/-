<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>出荷リスト図番リンク付与</title>
<style>
:root{--bg:#000;--fg:#e6eaf2;--card:#0b0f16;--line:#2a3342;--acc:#58a6ff;--ok:#3fb68b;--warn:#e0a458;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,"Hiragino Sans","Yu Gothic",sans-serif}
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-bottom:4px}.hdr h1{margin:0;grid-column:2;grid-row:1;text-align:center}.brand{grid-column:3;grid-row:1;justify-self:end;display:flex;align-items:center;gap:8px}.logo{height:34px;width:auto}.logo-mark{fill:#e60012}.logo-text{fill:#fff}.company{color:#fff;font-size:17px;white-space:nowrap;font-family:"Yu Gothic","游ゴシック","Meiryo","メイリオ","Hiragino Kaku Gothic ProN",sans-serif;font-weight:800}
@media(max-width:520px){.company{display:none}}

#drop{position:relative;overflow:hidden;animation:glowPulse 3s ease-in-out infinite}
#drop.over,#drop:hover{border-color:var(--acc);animation:none}
#drop b{display:block;margin-top:14px}
.stage{position:relative;height:150px;overflow:hidden;pointer-events:none}
.stage.busy{opacity:.3}
/* 6秒周期(速度70%): 左から赤PDF→中央で発光しピンクの「リンク付き」へ→右へ移動して消える→1秒の間→繰り返し */
.fi{position:absolute;top:50%;left:-150px;margin-top:-60px;display:flex;flex-direction:column;align-items:center;gap:8px;opacity:0;animation:move 6s ease-in-out infinite}
.fi .box{width:112px;height:120px;border-radius:10px;position:relative;animation:glow 6s ease-in-out infinite}
.fi .b{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;line-height:1.3;text-align:center;font-weight:bold;letter-spacing:1px;color:#fff}
.fi .b-red{background:linear-gradient(135deg,#c0392b,#e74c3c);box-shadow:0 0 12px rgba(231,76,60,.5);animation:toRed 6s ease-in-out infinite}
.fi .b-pink{background:linear-gradient(135deg,#f06292,#ff8fb8);box-shadow:0 0 14px rgba(255,111,165,.6);opacity:0;animation:toPink 6s ease-in-out infinite}
.fi .two{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;animation:toRed 6s ease-in-out infinite}
.fi .c{flex:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:bold;white-space:nowrap}
.fi .c-red{background:linear-gradient(135deg,#c0392b,#e74c3c);color:#fff;box-shadow:0 0 10px rgba(231,76,60,.5)}
.fi .c-green{background:#c8efd4;color:#1f6b3a;box-shadow:0 0 10px rgba(160,230,185,.45)}
.fi .b-pink::after{content:"🔗";position:absolute;right:-16px;bottom:-16px;font-size:36px}
.fi .labs{position:relative;height:14px;width:80px;font-size:10px;letter-spacing:1px;color:#8a94a6;text-align:center}
.fi .labs span{position:absolute;inset:0}
.fi .labs .l2{color:#e0558a;font-weight:bold;opacity:0;animation:toPink 6s ease-in-out infinite}
.fi .labs .l1{animation:toRed 6s ease-in-out infinite}
@keyframes move{0%{left:-150px;opacity:0}4%{opacity:1}28%,47%{left:calc(50% - 56px);opacity:1}70%{opacity:1}76%{left:calc(100% + 150px);opacity:0}100%{left:calc(100% + 150px);opacity:0}}
@keyframes toRed{0%,30%{opacity:1}36%,100%{opacity:0}}
@keyframes toPink{0%,30%{opacity:0}36%,100%{opacity:1}}
@keyframes glow{0%,28%{transform:scale(1);filter:none}33%{transform:scale(1.35);filter:brightness(1.8) drop-shadow(0 0 16px #fff) drop-shadow(0 0 28px #ff8fb8)}40%{transform:scale(1.1);filter:brightness(1.3) drop-shadow(0 0 10px #ff8fb8)}47%,100%{transform:scale(1);filter:none}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 10px rgba(31,111,235,.10)}50%{box-shadow:0 0 22px rgba(31,111,235,.25)}}
body.dragging::after{content:"ここにドロップ";position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold;color:var(--acc);background:rgba(31,111,235,.10);border:4px dashed var(--acc);pointer-events:none}
#modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex}.mbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px 28px;max-width:420px;width:100%;text-align:center;box-shadow:0 0 30px rgba(88,166,255,.2)}
#modalText div{margin:6px 0;font-size:16px}#modalText div:first-child{font-weight:bold;font-size:18px}
#modal.mok #modalText div:first-child{color:var(--ok)}#modal.mng #modalText div:first-child{color:var(--warn)}
#modalNote{font-size:12px;color:#8a94a6;margin-top:6px}
#modalOk{margin-top:16px;min-width:120px;padding:8px 18px;font-size:16px;border:0;border-radius:8px;background:var(--acc);color:#000;font-weight:bold;cursor:pointer}
.manual{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:40;background:#ffd400;color:#000;font-weight:bold;font-size:15px;text-decoration:none;padding:10px 26px;border-radius:999px;border:2px solid #fff3a0;white-space:nowrap;animation:manualGlow 2s ease-in-out infinite}
.manual:hover{background:#ffe34d}
@keyframes manualGlow{0%,100%{box-shadow:0 0 6px #ffd400,0 0 14px rgba(255,212,0,.55)}50%{box-shadow:0 0 14px #ffe66d,0 0 32px rgba(255,212,0,.9)}}
main{padding-bottom:84px!important}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}h1{font-size:20px}
.sub{color:#8a94a6;font-size:13px;margin-bottom:16px}
#drop{border:2px dashed var(--line);background:var(--card);border-radius:12px;padding:44px 16px;text-align:center;cursor:pointer}
#drop.over{border-color:var(--acc)}#drop b{font-size:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}.stat{flex:1;min-width:110px}.stat span{display:block;font-size:12px;color:#8a94a6}.stat strong{font-size:24px}
.ok{color:var(--ok)}.warn{color:var(--warn)}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
#msg{margin-top:10px;font-size:13px}.small{font-size:12px;color:#8a94a6}
