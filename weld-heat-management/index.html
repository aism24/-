<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>入熱・パス間温度管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ホーム画面 -->
<div id="home-screen" class="screen">
  <div class="home-title">🔥 入熱・パス間温度管理</div>
  <div class="home-subtitle">工事を選んで記録を始めてください</div>
  <button class="home-btn home-btn-main" onclick="goProjectList()">📁 工事一覧・新規記録</button>
  <button class="home-btn home-btn-sub" onclick="goHistory()">📜 履歴を検索する</button>
</div>

<!-- 共通ヘッダー -->
<div id="app-header" class="app-header" style="display:none;">
  <button class="header-back-btn" id="header-back-btn" onclick="goBack()">← 戻る</button>
  <div class="header-title" id="app-header-title">タイトル</div>
  <div class="header-spacer"></div>
</div>

<!-- 工事一覧 -->
<div id="project-list-screen" class="screen" style="display:none;">
  <div class="section">
    <div class="field-label">＋ 新しい工事を作成</div>
    <div class="new-row">
      <input type="text" id="new-project-name" placeholder="工事名を入力">
      <button class="small-btn" onclick="submitNewProject()">作成</button>
    </div>
  </div>
  <div class="list" id="project-list"><div class="loading-text">読み込み中...</div></div>
</div>

<!-- 部材一覧(工事詳細) -->
<div id="part-list-screen" class="screen" style="display:none;">
  <div class="section">
    <div class="field-label">＋ 新しい部材を登録</div>
    <div class="form-grid">
      <input type="text" id="new-part-code" placeholder="部材符号 (例: G1-3)">
      <input type="text" id="new-part-steel" placeholder="鋼材種別 (例: SN490B)">
      <input type="text" id="new-part-thickness" placeholder="板厚 (mm)">
    </div>
    <button class="small-btn full-btn" onclick="submitNewPart()">部材を登録</button>
  </div>
  <div class="list" id="part-list"><div class="loading-text">読み込み中...</div></div>
</div>

<!-- 継手一覧(部材詳細) -->
<div id="joint-list-screen" class="screen" style="display:none;">
  <button class="home-btn home-btn-main" onclick="goJointNew()">＋ 新しい継手の記録を開始</button>
  <div class="list" id="joint-list"><div class="loading-text">読み込み中...</div></div>
</div>

<!-- 新規継手ヘッダー入力 -->
<div id="joint-new-screen" class="screen" style="display:none;">
  <div class="section">
    <div class="field-label">継手位置・名称 <span class="req">必須</span></div>
    <input type="text" id="jn-position" placeholder="例: 1F-C3柱 現場継手">
    <div class="form-grid two-col">
      <div>
        <div class="field-label small">溶接姿勢</div>
        <select id="jn-posture">
          <option>下向</option><option>横向</option><option>立向</option><option>上向</option>
        </select>
      </div>
      <div>
        <div class="field-label small">溶接方法</div>
        <input type="text" id="jn-method" placeholder="例: CO2半自動">
      </div>
    </div>
    <div class="form-grid two-col">
      <div>
        <div class="field-label small">溶接材料(ワイヤー等)</div>
        <input type="text" id="jn-material" placeholder="例: YGW11">
      </div>
      <div>
        <div class="field-label small">溶接長 (cm・任意)</div>
        <input type="number" id="jn-weldlength" placeholder="入熱自動計算に使用">
      </div>
    </div>
    <div class="form-grid two-col">
      <div>
        <div class="field-label small">溶接士名</div>
        <input type="text" id="jn-welder" placeholder="溶接士名">
      </div>
      <div>
        <div class="field-label small">検査員名</div>
        <input type="text" id="jn-inspector" placeholder="検査員名">
      </div>
    </div>
    <div class="field-label small" style="margin-top:20px;">管理基準値</div>
    <div class="form-grid two-col">
      <div>
        <div class="field-label small">入熱上限 (kJ/cm)</div>
        <input type="number" id="jn-heatlimit" placeholder="例: 40">
      </div>
      <div></div>
    </div>
    <div class="form-grid two-col">
      <div>
        <div class="field-label small">パス間温度下限 (℃)</div>
        <input type="number" id="jn-tempmin" placeholder="例: 50">
      </div>
      <div>
        <div class="field-label small">パス間温度上限 (℃)</div>
        <input type="number" id="jn-tempmax" placeholder="例: 350">
      </div>
    </div>
    <button class="save-btn full-btn" onclick="submitNewJoint()">記録を開始する</button>
  </div>
</div>

<!-- パス記録画面 -->
<div id="joint-record-screen" class="screen" style="display:none;">
  <div class="joint-summary" id="joint-summary"></div>

  <div class="section" id="pass-input-section">
    <div class="field-label">パス <span id="next-pass-no">1</span> を記録</div>
    <div class="form-grid three-col">
      <div>
        <div class="field-label small">電流 (A)</div>
        <input type="number" inputmode="decimal" id="pi-current" placeholder="A">
      </div>
      <div>
        <div class="field-label small">電圧 (V)</div>
        <input type="number" inputmode="decimal" id="pi-voltage" placeholder="V">
      </div>
      <div>
        <div class="field-label small">速度(cm/min・任意)</div>
        <input type="number" inputmode="decimal" id="pi-speed" placeholder="任意">
      </div>
    </div>
    <div class="field-label small" style="margin-top:16px;">パス間温度 (℃) <span class="req">必須</span></div>
    <input type="number" inputmode="decimal" id="pi-temp" placeholder="測定温度" class="big-input">
    <div class="field-label small" style="margin-top:16px;">備考</div>
    <input type="text" id="pi-note" placeholder="任意">
    <button class="save-btn full-btn" onclick="submitPass()">✅ このパスを記録</button>
  </div>

  <div class="section">
    <div class="field-label">記録済みパス一覧</div>
    <div class="pass-table-wrap">
      <table class="pass-table" id="pass-table">
        <thead><tr>
          <th>#</th><th>時刻</th><th>電流</th><th>電圧</th><th>速度</th><th>入熱</th><th>温度</th><th>判定</th>
        </tr></thead>
        <tbody id="pass-table-body"></tbody>
      </table>
    </div>
  </div>

  <div class="section" id="complete-section">
    <button class="finish-btn full-btn" onclick="onCompleteJoint()">🏁 溶接完了・記録を確定する</button>
  </div>

  <div class="section" id="pdf-section" style="display:none;">
    <div class="result-banner" id="result-banner"></div>
    <button class="pdf-btn full-btn" onclick="onGeneratePdf()">📄 PDFを出力する</button>
    <div id="pdf-link-wrap" style="display:none;">
      <a id="pdf-link" href="#" target="_blank" class="pdf-link-btn">📄 PDFを開く</a>
    </div>
  </div>
</div>

<!-- 履歴検索画面 -->
<div id="history-screen" class="screen" style="display:none;">
  <div class="section">
    <div class="new-row">
      <input type="text" id="history-keyword" placeholder="工事名・部材符号・継手名・氏名で検索">
      <button class="small-btn" onclick="submitHistorySearch()">検索</button>
    </div>
  </div>
  <div class="list" id="history-list"><div class="loading-text">読み込み中...</div></div>
</div>

<!-- ローディング/メッセージ用オーバーレイ -->
<div class="overlay" id="overlay" style="display:none;">
  <div class="overlay-box">
    <div class="overlay-icon" id="overlay-icon">⏳</div>
    <div class="overlay-message" id="overlay-message">処理中...</div>
    <button class="overlay-close-btn" id="overlay-close-btn" style="display:none;" onclick="hideOverlay()">閉じる</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
