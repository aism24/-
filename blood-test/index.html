<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>血液検査記録</title>
<link rel="stylesheet" href="style.css?v=20261028m">
</head>
<body>
<header class="top">
  <h1>血液検査記録</h1>
  <div id="sub" class="sub">読み込み中…</div>
</header>

<div class="backbar" id="backbar" hidden>
  <button id="toMenu" class="btn" type="button">← メニューへ</button>
</div>

<nav class="tabs" id="tabs" hidden>
  <button data-tab="summary" class="on" type="button">サマリー</button>
  <button data-tab="graph" type="button">グラフ</button>
  <button data-tab="urine" type="button">検尿</button>
  <button data-tab="list" type="button">一覧</button>
</nav>

<main>
  <div id="msg" class="msg" hidden></div>

  <section id="menu" class="menu">
    <button id="goImport" class="menubtn" type="button">📷 新規記録<small>(画像取り込み)</small></button>
    <button id="goAnalysis" class="menubtn" type="button">📊 検査結果分析</button>
  </section>

  <section id="tab-summary" class="panel" hidden></section>

  <section id="tab-graph" class="panel" hidden>
    <div class="row">
      <label>項目
        <select id="selA"></select>
      </label>
      <label>重ねて比較(右軸)
        <select id="selB"></select>
      </label>
    </div>
    <div class="chips" id="chips"></div>
    <div class="row">
      <div class="seg" id="period">
        <button data-p="all" class="on" type="button">全期間</button>
        <button data-p="365" type="button">1年</button>
        <button data-p="180" type="button">半年</button>
        <button data-p="90" type="button">3か月</button>
      </div>
    </div>
    <div class="chartbox"><canvas id="chart"></canvas></div>
    <div id="chartNote" class="note"></div>
    <div id="graphTip" class="gloss"></div>
  </section>

  <section id="tab-urine" class="panel" hidden></section>

  <section id="tab-list" class="panel" hidden>
    <div class="row">
      <label>検査日
        <span class="datenav">
          <button id="datePrev" type="button" aria-label="前回の検査へ">◀</button>
          <select id="selDate"></select>
          <button id="dateNext" type="button" aria-label="次回の検査へ">▶</button>
        </span>
      </label>
    </div>
    <div id="listBody"></div>
  </section>

  <section id="tab-import" class="panel" hidden>
    <div class="imp-actions">
      <label class="btn big">📷 カメラで撮影<input id="fCam" type="file" accept="image/*" capture="environment" hidden></label>
      <label class="btn big">🖼 画像・PDFを選ぶ<input id="fPick" type="file" accept="image/*,application/pdf" multiple hidden></label>
    </div>
    <div class="note">検査結果照会の紙(またはPDF)を、1ページずつ撮影してください。PDFは自動でページごとに分けます。読み取り結果は、確認して直してから記録に追加します。</div>
    <div id="impList" class="imp-list"></div>
    <div class="imp-actions">
      <button id="impRun" class="btn primary" type="button" hidden>読み取る</button>
      <button id="impClear" class="btn" type="button" hidden>クリア</button>
    </div>
    <div id="impMsg" class="msg" hidden></div>
    <div id="impReview"></div>
  </section>
</main>

<footer class="foot">判定の「良くなった・悪くなった」は目安です。診断や治療の判断は主治医に確認してください。</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="config.js?v=20261028m"></script>
<script src="glossary.js?v=20261028m"></script>
<script src="app.js?v=20261028m"></script>
<script src="import.js?v=20261028m"></script>
</body>
</html>
