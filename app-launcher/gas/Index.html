<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: "Segoe UI", "Meiryo", sans-serif;
      margin: 40px;
      color: #eee;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-bottom: 24px;
    }
    .header .logo {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
    }
    h1 {
      font-size: 30px;
      margin: 0;
      color: #fff;
    }
    /* 行ごとにスタッキングコンテキストを持たせ、ホバー中/タップでactiveな行だけ
       z-indexを上げることで、拡大したカードが同じ行の後続ボタンや次の行の内容の
       下に隠れて枠が欠けたり、逆に後続ボタンが拡大パネルの上に浮いて見えたり
       する問題を避ける(カード単体のz-indexだけでは祖先が持つ既定の描画順に
       負けて後続の行・ボタンの下に隠れることがあるため、行単位で上げる)。 */
    .category-row {
      position: relative;
      z-index: 0;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      width: 100%;
      /* 固定の900pxではなく、実際の画面幅いっぱいまで使う(bodyのmargin 40px×2分
         だけ差し引く)。ボタンは画面幅に収まる限り折り返さず、画面より大きくなる
         場合だけ.gridのflex-wrapで折り返す。 */
      max-width: calc(100vw - 80px);
      box-sizing: border-box;
      margin: 12px 0;
      padding-bottom: 12px;
      border-bottom: 1px solid #2a2a2a;
    }
    .category-row:hover,
    .category-row:has(.card.active) {
      z-index: 10;
    }
    .category-row:first-of-type {
      margin-top: 0;
    }
    /* 分類ラベルは全行共通の固定幅にする。幅は最長の分類文字列「★★調整中★★」が
       1行に収まる幅を基準にしている。これにより、どの分類でもボタン列の開始位置
       (左端)が揃う。これより長い分類名はcategoryLabelHtml_()側で最後の
       アンダースコアの位置に改行を入れて2行に収める。 */
    h2.category {
      flex: 0 0 116px;
      padding-top: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #999;
      letter-spacing: 0.05em;
      line-height: 1.4;
      margin: 0;
    }
    /* ボタン同士の間隔。ここが狭いと、境目にマウスがある時に隣接ボタンの
       ホバーが交互に切り替わってちらつく原因になるため、ある程度の余白を
       持たせる(広すぎるとレイアウトが間延びするので最小限の調整に留める)。 */
    .grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-start;
      gap: 24px;
      flex: 1;
      min-width: 0;
    }
    .card {
      position: relative;
      z-index: 1;
      cursor: pointer;
      width: fit-content;
    }
    .card:hover,
    .card.active {
      z-index: 10;
    }
    .card .icon {
      min-width: 36px;
      height: 36px;
      padding: 0 8px;
      border-radius: 8px;
      background: var(--accent);
      color: var(--text, #fff);
      font-weight: bold;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }
    /* 通常時は上のicon(枠なし・ボタンそのもの)だけが見えている。ホバー時(PC)/
       タップ時(タッチ)は、このdetailsパネルが、アイコンを内側に複製した状態で
       1つの枠として表示され、元のアイコンを覆い隠す(=ロゴボタン+名前+説明が
       ひとつの外枠に収まって見える)。初期表示では枠は一切出ない。
       タッチ環境ではJS側で付与する.activeクラスだけを表示条件にする。
       【重要】:hoverによる表示は@media(hover: hover)で必ずPC(マウス)環境限定に
       すること。iPad Safariには「一度触れた要素の:hoverが、別のボタンをタップ
       しても解除されずに残り続ける」既知の挙動があり、:hoverの表示条件をタッチ
       環境でも有効なままにすると、JS側で.activeを正しく1つに絞り込んでいても
       前にタップしたボタンの:hoverが残って両方同時に展開されて見えてしまう
       (実機で発見)。 */
    .card .details {
      display: none;
    }
    .card.active .details {
      display: block;
      position: absolute;
      top: -14px;
      left: -14px;
      z-index: 1;
      box-sizing: border-box;
      min-width: calc(100% + 28px);
      transform: scale(2);
      transform-origin: top left;
      background: #161616;
      border: 4px solid var(--accent);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 0 16px var(--accent), 0 6px 16px rgba(0, 0, 0, 0.5);
    }
    @media (hover: hover) {
      .card:hover .details {
        display: block;
        position: absolute;
        top: -14px;
        left: -14px;
        z-index: 1;
        box-sizing: border-box;
        min-width: calc(100% + 28px);
        transform: scale(2);
        transform-origin: top left;
        background: #161616;
        border: 4px solid var(--accent);
        border-radius: 12px;
        padding: 14px;
        box-shadow: 0 0 16px var(--accent), 0 6px 16px rgba(0, 0, 0, 0.5);
        /* 拡大表示中のdetailsをマウスイベントに対して透過させる。これにより
           「ホバーが継続する当たり判定」は常に元のアイコンボタンの実サイズ
           範囲のままになり(見た目だけ2倍)、拡大表示が隣のボタンの上に覆い
           かぶさっていても、実際にマウスが隣のボタンの実サイズ範囲に入った
           時点ですぐそちらのホバーに切り替わる。 */
        pointer-events: none;
      }
    }
    .card:hover .details .icon,
    .card.active .details .icon {
      margin-bottom: 12px;
    }
    .card .name {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 4px;
      color: #f5f5f5;
      white-space: nowrap;
    }
    .card .desc {
      font-size: 12px;
      color: #999;
      line-height: 1.4;
      white-space: nowrap;
    }
    .empty {
      color: #888;
    }
  </style>
</head>

    <h1>アプリ一覧</h1>
  </div>

  <? if (groups.length === 0) { ?>
    <div class="empty">登録されたアプリがありません。</div>
  <? } ?>

  <?
    // 分類名にアンダースコアが2つ以上ある(例:「Excel_マスタ_実寸法師」)場合、
    // 最後のアンダースコアの位置で改行して2行に収める(左の固定幅列
    // 「★★調整中★★」基準の幅に収まるようにするため)。それ以外はそのまま1行。
    function escapeHtml_(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function categoryLabelHtml_(text) {
      var parts = String(text).split('_');
      if (parts.length >= 3) {
        var last = parts.pop();
        return escapeHtml_(parts.join('_')) + '<br>' + escapeHtml_(last);
      }
      return escapeHtml_(text);
    }
  ?>

  <? for (var g = 0; g < groups.length; g++) { ?>
    <div class="category-row">
      <h2 class="category"><?!= categoryLabelHtml_(groups[g].category) ?></h2>
      <div class="grid">
        <? var apps = groups[g].apps; ?>
        <? for (var i = 0; i < apps.length; i++) { ?>
          <?
            var app_ = apps[i];
          ?>
          <div class="card"
               style="--accent: <?!= app_.color ?>; --text: <?!= app_.textColor ?>"
               data-url="<?= app_.url ?>"
               data-name="<?= app_.name ?>">
            <div class="icon"><?= app_.initial ?></div>
            <div class="details">
              <div class="icon"><?= app_.initial ?></div>
              <div class="name"><?= app_.name ?></div>
              <? if (app_.description) { ?>
                <div class="desc"><?= app_.description ?></div>
              <? } ?>
            </div>
          </div>
        <? } ?>
      </div>
    </div>
  <? } ?>

  <script>
    // マウスホバーに対応する環境か(PC等)。タッチ専用環境(iPad等)ではfalseになる。
    // falseの場合、タップを「1回目=ホバー相当の表示」「同じカードへの2回目=
    // 起動」という2段階の挙動に切り替える(GitHub Pages版のapp.jsと同じ対応)。
    var supportsHover = window.matchMedia('(hover: hover)').matches;

    function openCard(card) {
      var url = card.getAttribute('data-url');
      var name = card.getAttribute('data-name');
      window.open(url, '_blank');
      google.script.run.logAppOpen(name);
    }

    // カード外側のタップで、開いたままの.active表示をすべて閉じる。
    document.addEventListener('click', function (e) {
      if (!e.target.closest('.card')) {
        document.querySelectorAll('.card.active').forEach(function (c) {
          c.classList.remove('active');
        });
      }
    });

    if (supportsHover) {
      // マウス環境: ホバーで詳細が見えるので、クリックはそのまま即起動でよい
      // (タッチ環境の2段階タップ処理は下のdocument委譲リスナーが担当する)。
      document.querySelectorAll('.card').forEach(function (card) {
        card.addEventListener('click', function () {
          openCard(card);
        });
      });
    } else {
      // タッチ環境: タップの当たり判定を「拡大表示された見た目」ではなく、常に
      // 各カードの実サイズのアイコン範囲を基準に判定し直す。ホバー中(active)の
      // カードの拡大パネルが隣の本来のボタン位置に視覚的に重なっていても、実際
      // に押した座標がどのカードの実サイズ範囲に入っているかで対象を決めるため、
      // 別のボタンへ1タップで直接切り替えられる(拡大パネルの見た目の重なり順に
      // 引きずられて、覆われた奥のカードが誤って開いてしまうことがない)。
      // キャプチャフェーズで先取りし、通常のクリック伝播より先に判定・処理する。
      document.addEventListener('click', function (e) {
        var icons = document.querySelectorAll('.card > .icon');
        var hitCard = null;
        for (var i = 0; i < icons.length; i++) {
          var r = icons[i].getBoundingClientRect();
          if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) {
            hitCard = icons[i].parentElement;
            break;
          }
        }

        // 実サイズのアイコン範囲に当たらなくても、タップ位置がすでにactiveな
        // カードの拡大パネル(名前・説明を含む)の内側であれば、そのカードへの
        // タップとして扱う(2回目のタップで開く操作は、拡大表示のどこを押しても
        // 反応してよいため)。
        if (!hitCard) {
          var activeAncestor = e.target.closest('.card.active');
          if (activeAncestor) hitCard = activeAncestor;
        }

        if (!hitCard) return; // 本当に何もない背景 → 外側クリック扱いのまま

        e.stopPropagation();
        e.preventDefault();

        var wasActive = hitCard.classList.contains('active');
        document.querySelectorAll('.card.active').forEach(function (c) {
          if (c !== hitCard) c.classList.remove('active');
        });

        if (wasActive) {
          openCard(hitCard);
          hitCard.classList.remove('active');
        } else {
          hitCard.classList.add('active');
        }
      }, true);
    }
  </script>
</body>
</html>
