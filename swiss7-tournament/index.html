<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>TSBL大会運営（７チームVer）</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="bgAnimalTrack" aria-hidden="true"><span id="bgAnimal">🐼</span></div>

<div id="homeScreen">
  <h1>TSBL大会運営（７チームVer）</h1>

  <div class="card">
    <button type="button" id="toggleCreateBtn" class="btnCreate" onclick="toggleCreateForm()">新しい大会を作成</button>
    <div id="createFormBody" style="display:none">
      <label>大会名
        <input type="text" id="newTournamentName" placeholder="例: 春季大会">
      </label>
      <label>略称（シート名に使用・最大4文字）
        <input type="text" id="newTournamentPrefix" maxlength="4" placeholder="例: 春季">
      </label>
      <p class="hint">略称は大会名の頭2文字が自動入力されます。編集して4文字まで変更できます。「(略称)＿１日目」「(略称)２日目」のシートが作成されます。</p>
      <button class="btnCreate" onclick="createTournament()">作成</button>
      <div id="createError" class="errorText"></div>
    </div>
  </div>

  <div class="card">
    <h2>大会一覧</h2>
    <div id="tournamentList">読み込み中…</div>
  </div>
</div>

<div id="loadingOverlay">
  <div class="loadingBox">
    <div class="loadingBar"><div class="loadingBarInner"></div></div>
    <div id="loadingText">読み取り中…</div>
  </div>
</div>

<div id="digitPickerOverlay" class="digitPickerOverlay">
  <div class="digitPickerBox">
    <div id="digitPickerTitle" class="digitPickerTitle"></div>
    <div id="digitPickerButtons" class="digitPickerButtons"></div>
    <button type="button" class="digitPickerClose" onclick="closeDigitPicker()">閉じる</button>
  </div>
</div>

<div id="tournamentApp" style="display:none">
  <button type="button" class="backBtn" onclick="showHome()">← 大会一覧に戻る</button>
  <h1 id="tournamentTitle">大会</h1>
  <div class="tabs">
    <button id="tabBtn-teams" onclick="showTab('teams')">チーム登録</button>
    <button id="tabBtn-day1" onclick="showTab('day1')">1日目</button>
    <button id="tabBtn-day2" onclick="showTab('day2')">2日目</button>
  </div>
  <div id="status"></div>

  <!-- ============ チーム登録 ============ -->
  <div id="panel-teams" class="panel">
    <p class="hint">1日目の対戦順になります。7チーム分すべて入力してください。</p>
    <div id="teamInputs"></div>
    <div id="teamsError" class="errorText"></div>
    <button onclick="saveTeams()">保存</button>
  </div>

  <!-- ============ 1日目 ============ -->
  <div id="panel-day1" class="panel">
    <div id="day1Content"></div>
  </div>

  <!-- ============ 2日目 ============ -->
  <div id="panel-day2" class="panel">
    <div id="day2Content"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
